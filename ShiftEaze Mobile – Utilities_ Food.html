<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070709">
<meta name="description" content="ShiftEaze Mobile Workforce Application presented inside a realistic iPhone 17 Pro Max mockup">
<title>ShiftEaze – iPhone 17 Pro Max</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* CSS Tokens & Theme Variables */
:root {
  --hdr: #EEF0FB;
  --ttl: #332680;
  --pri: #433096;
  --pri-2: #33247A;
  --pri-soft: #ECE8F8;

  --nav-on: #C91515;

  --bg: #FAFAFC;
  --card: #FFFFFF;

  --ink: #16161D;
  --ink-2: #4B4F5A;
  --ink-3: #6B6F7A;

  --line: #E4E4EB;

  --peach: #FBEBD1;
  --peach-ink: #8A5A06;

  --mint: #E3F3DF;
  --mint-ink: #1B3306;

  --sky: #E2ECFB;
  --sky-ink: #34579C;

  --rose: #FDE9F0;
  --rose-ic: #F0588F;

  --good: #146C43;
  --good-bg: #E2F3E9;

  --warn: #8A4F00;
  --warn-bg: #FFF0D9;

  --bad: #A3211A;
  --bad-bg: #FCEBE9;

  --neu: #4A4660;
  --neu-bg: #EFEDF5;

  --shadow: 0 4px 16px rgba(30, 25, 70, 0.08);
  --shadow-elevated: 0 8px 24px rgba(30, 25, 70, 0.11);
  --font: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --hdr: #1d1b2b;
    --ttl: #c9bdf7;
    --pri: #7b63d6;
    --pri-2: #6a52c6;
    --pri-soft: #2a2446;
    --nav-on: #ff7a70;
    --bg: #111117;
    --card: #1b1b23;
    --ink: #ececf2;
    --ink-2: #b4b6c2;
    --ink-3: #9194a2;
    --line: #2c2c38;
    --peach: #3a2d17;
    --peach-ink: #f2c06d;
    --mint: #1c2d1a;
    --mint-ink: #b7dea6;
    --sky: #1a2438;
    --sky-ink: #a9c3f2;
    --rose: #3a1c28;
    --rose-ic: #f0588f;
    --good: #67d39a;
    --good-bg: #14301f;
    --warn: #f0b35a;
    --warn-bg: #35270f;
    --bad: #f08a80;
    --bad-bg: #3a1a18;
    --neu: #c3bfd8;
    --neu-bg: #262434;
    --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    --shadow-elevated: 0 8px 24px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --hdr: #1d1b2b;
  --ttl: #c9bdf7;
  --pri: #7b63d6;
  --pri-2: #6a52c6;
  --pri-soft: #2a2446;
  --nav-on: #ff7a70;
  --bg: #111117;
  --card: #1b1b23;
  --ink: #ececf2;
  --ink-2: #b4b6c2;
  --ink-3: #9194a2;
  --line: #2c2c38;
  --peach: #3a2d17;
  --peach-ink: #f2c06d;
  --mint: #1c2d1a;
  --mint-ink: #b7dea6;
  --sky: #1a2438;
  --sky-ink: #a9c3f2;
  --rose: #3a1c28;
  --rose-ic: #f0588f;
  --good: #67d39a;
  --good-bg: #14301f;
  --warn: #f0b35a;
  --warn-bg: #35270f;
  --bad: #f08a80;
  --bad-bg: #3a1a18;
  --neu: #c3bfd8;
  --neu-bg: #262434;
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  --shadow-elevated: 0 8px 24px rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  background: #070709;
  color: var(--ink);
  font: 15px/1.45 var(--font);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

/* ==================================================
   PAGE SHELL & PRESENTATION STAGE
   ================================================== */
.page-shell {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 35%, #181724 0%, #0c0b12 55%, #050508 100%);
  position: relative;
  overflow: hidden;
}

/* Ambient floor lighting */
.page-shell::before {
  content: '';
  position: absolute;
  width: 700px;
  height: 700px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(67, 48, 150, 0.14) 0%, transparent 70%);
  pointer-events: none;
  filter: blur(50px);
}

.device-stage {
  display: flex;
  align-items: center;
  justify-content: center;
  transform-origin: center center;
  will-change: transform;
  position: relative;
  z-index: 10;
}

/* ==================================================
   IPHONE 17 PRO MAX PHYSICAL FRAME
   ================================================== */
.iphone-frame {
  position: relative;
  width: 440px;
  height: 956px;
  padding: 3.5px;
  border-radius: 58px;
  background: #000000;
  box-shadow:
    0 0 0 1px #040406,
    0 0 0 2px rgba(255, 255, 255, 0.16),
    0 0 0 5.5px #25242a,
    0 0 0 6.5px rgba(255, 255, 255, 0.22),
    0 0 0 7.5px #121117,
    0 25px 65px -10px rgba(0, 0, 0, 0.95),
    0 45px 120px -15px rgba(0, 0, 0, 0.98),
    0 12px 30px rgba(0, 0, 0, 0.7);
  user-select: none;
  flex-shrink: 0;
}

/* Antenna cutouts */
.iphone-frame::before {
  content: '';
  position: absolute;
  top: 95px;
  left: -7.5px;
  width: calc(100% + 15px);
  height: calc(100% - 190px);
  pointer-events: none;
  border-left: 2px solid #16151a;
  border-right: 2px solid #16151a;
  z-index: 2;
}

/* Metallic brushed highlight overlay */
.frame-glare {
  position: absolute;
  inset: -7.5px;
  border-radius: 65.5px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  pointer-events: none;
  z-index: 5;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, transparent 20%, transparent 80%, rgba(255, 255, 255, 0.08) 100%);
}

/* ==================================================
   HARDWARE SIDE BUTTONS (DECORATIVE)
   ================================================== */
.hw-btn {
  position: absolute;
  background: linear-gradient(to right, #38373e, #1a191f);
  pointer-events: none;
  z-index: 1;
}

.hw-action {
  left: -11px;
  top: 140px;
  width: 4px;
  height: 32px;
  border-radius: 3px 0 0 3px;
  box-shadow: -1px 0 2px rgba(0, 0, 0, 0.6);
}

.hw-vol-up {
  left: -11px;
  top: 190px;
  width: 4px;
  height: 58px;
  border-radius: 3px 0 0 3px;
  box-shadow: -1px 0 2px rgba(0, 0, 0, 0.6);
}

.hw-vol-down {
  left: -11px;
  top: 260px;
  width: 4px;
  height: 58px;
  border-radius: 3px 0 0 3px;
  box-shadow: -1px 0 2px rgba(0, 0, 0, 0.6);
}

.hw-power {
  right: -11px;
  top: 215px;
  width: 4px;
  height: 86px;
  background: linear-gradient(to left, #38373e, #1a191f);
  border-radius: 0 3px 3px 0;
  box-shadow: 1px 0 2px rgba(0, 0, 0, 0.6);
}

.hw-camera-control {
  right: -9.5px;
  top: 690px;
  width: 2.5px;
  height: 64px;
  background: linear-gradient(to left, #2c2b31, #16151a);
  border-radius: 0 2px 2px 0;
  box-shadow: inset 0 0 1px rgba(0, 0, 0, 0.8);
}

/* ==================================================
   IPHONE DISPLAY SCREEN (440 × 956)
   ================================================== */
.iphone-display {
  position: relative;
  width: 440px;
  height: 956px;
  border-radius: 54px;
  overflow: hidden;
  background: var(--bg);
  transform: translateZ(0);
  -webkit-mask-image: -webkit-radial-gradient(white, black);
  display: flex;
  flex-direction: column;
}

/* Realistic glass specular reflection */
.display-glass-glare {
  position: absolute;
  inset: 0;
  border-radius: 54px;
  background: linear-gradient(130deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.015) 24%, transparent 45%);
  pointer-events: none;
  z-index: 998;
}

/* ==================================================
   TOP HARDWARE: DYNAMIC ISLAND
   ================================================== */
.dynamic-island-wrapper {
  position: absolute;
  top: 11px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  pointer-events: none;
}

.dynamic-island {
  width: 124px;
  height: 35px;
  background: #000000;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  box-shadow: 0 0 1px 1px rgba(255, 255, 255, 0.06), inset 0 0 2px rgba(255, 255, 255, 0.08);
}

.island-sensor {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, #0d0f17 0%, #000000 80%);
}

.island-camera {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #1c2b48 0%, #091222 55%, #000000 100%);
  box-shadow: inset 0 0 2px rgba(70, 130, 240, 0.35);
  position: relative;
}

.island-camera::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.4);
}

/* ==================================================
   BOTTOM HARDWARE: HOME INDICATOR BAR
   ================================================== */
.home-indicator-bar {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 138px;
  height: 4.5px;
  border-radius: 100px;
  background: var(--ink);
  opacity: 0.85;
  z-index: 1000;
  pointer-events: none;
}

/* ==================================================
   APPLICATION STYLES (PHASE 2 DESIGN SYSTEM)
   ================================================== */
#root {
  height: 100%;
  width: 100%;
  display: flex;
  flex-direction: column;
}

button, input, select {
  font: inherit;
  color: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

:focus-visible {
  outline: 3px solid var(--pri);
  outline-offset: 2px;
  border-radius: 6px;
}

h1, h2, h3, p {
  margin: 0;
}

.app {
  position: relative;
  height: 100%;
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.muted { color: var(--ink-3); }
.small { font-size: 13px; }

/* Top header */
.top {
  flex: none;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 106px;
  padding: 48px 16px 12px 16px;
  background: var(--hdr);
}

.av {
  flex: none;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--pri-soft);
  color: var(--ttl);
  font-weight: 700;
  font-size: 14px;
  border: 2px solid #ffffff;
  box-shadow: 0 2px 6px rgba(30, 25, 70, 0.08);
}

.hi {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.hi b {
  font-size: 17px;
  font-weight: 700;
  color: var(--ttl);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.25;
}

.hi small {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12.5px;
  color: var(--ink-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .hi small {
    color: var(--ink-2);
  }
}

.brand {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ttl);
  white-space: nowrap;
}

.brand i {
  font-style: normal;
  color: var(--nav-on);
}

.ib {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border: 0;
  background: none;
  border-radius: 50%;
  cursor: pointer;
  color: var(--ink);
  transition: background 0.15s ease;
}

.ib:hover {
  background: rgba(30, 25, 70, 0.06);
}

/* Sub header */
.sub {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 98px;
  padding: 44px 14px 10px 10px;
  background: var(--hdr);
}

.sub .ib {
  color: var(--ttl);
}

.sub h1 {
  flex: 1;
  font-size: 19px;
  font-weight: 700;
  color: var(--ttl);
  line-height: 1.25;
}

.sub h1 small {
  display: block;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink-3);
  margin-bottom: 1px;
}

.clock-chip {
  border: 0;
  height: 32px;
  padding: 0 12px;
  border-radius: 16px;
  background: #ffffff;
  box-shadow: var(--shadow);
  color: var(--ttl);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: transform 0.12s ease;
}

.clock-chip:active {
  transform: scale(0.96);
}

.clock-chip.test {
  background: #ffe3a3;
  color: #5c3900;
}

/* Bottom nav */
.nav {
  flex: none;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  background: #ffffff;
  border-top: 1px solid var(--line);
  padding: 6px 0 calc(18px + env(safe-area-inset-bottom, 0px));
}

.nav a {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-height: 52px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  transition: color 0.15s ease;
}

.nav a svg {
  width: 26px;
  height: 26px;
}

.nav a.on {
  color: var(--nav-on);
  font-weight: 700;
}

.nav .dot {
  position: absolute;
  top: 2px;
  left: calc(50% + 2px);
  min-width: 28px;
  height: 15px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--nav-on);
  color: #ffffff;
  font-size: 9.5px;
  font-weight: 700;
  display: grid;
  place-items: center;
  letter-spacing: .02em;
}

/* Home */
.cards-row {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(112px, 1fr);
  gap: 12px;
}

.mini {
  min-height: 118px;
  border-radius: 18px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.mini.peach { background: var(--peach); color: var(--peach-ink); }
.mini.mint { background: var(--mint); color: var(--mint-ink); align-items: center; }
.mini.sky { background: var(--sky); color: var(--sky-ink); align-items: center; }
.mini .lbl { font-size: 12px; font-weight: 700; letter-spacing: .04em; }
.mini .big { font-size: 26px; font-weight: 700; line-height: 1; }
.mini .soon { padding: 3px 7px; border: 1.5px solid currentColor; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--card); white-space: nowrap; }

.sec {
  font-size: 19px;
  font-weight: 700;
  color: var(--ttl);
}

.qa {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.qa a {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 104px;
  padding: 10px 6px;
  background: var(--card);
  border-radius: 18px;
  box-shadow: var(--shadow);
  text-align: center;
  font-weight: 700;
  font-size: 14.5px;
  line-height: 1.2;
  border: 1px solid rgba(228, 228, 235, 0.4);
}

.new-tag {
  position: absolute;
  top: 6px;
  right: 6px;
  padding: 1px 6px;
  border-radius: 7px;
  background: var(--nav-on);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
}

.chart {
  background: #e8e7ef;
  border-radius: 20px;
  padding: 14px 10px 8px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .chart { background: var(--card); }
}

:root[data-theme="dark"] .chart { background: var(--card); }
.chart h3 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 0 0 4px 6px; }

.help {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  border-radius: 18px;
  background: var(--rose);
  box-shadow: var(--shadow);
}

.help .hic {
  flex: none;
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--rose-ic);
  color: #fff;
}

.help b { display: block; font-size: 17px; color: #2d3746; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .help b { color: var(--ink); }
}

.help span { font-size: 13.5px; color: #5f6368; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .help span { color: var(--ink-2); }
}

.food-banner {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-radius: 20px;
  background: var(--pri);
  color: #ffffff;
  box-shadow: 0 8px 24px rgba(67, 48, 150, 0.25);
}

.food-banner .fi {
  flex: none;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 13px;
  background: rgba(255, 255, 255, 0.16);
}

.food-banner b { display: block; font-size: 15.5px; font-weight: 700; }
.food-banner span { font-size: 13px; color: #e4defb; }

/* Generic Cards & Rows */
.card {
  background: #ffffff;
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 16px 18px;
  border: 1px solid rgba(228, 228, 235, 0.5);
}

.card.tight { padding: 4px 18px; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.card-h h2 { font-size: 16px; font-weight: 700; color: var(--ttl); }
.card-h a, .card-h button.link { font-size: 13px; font-weight: 600; color: var(--pri); border: 0; background: none; cursor: pointer; padding: 6px 0; }

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-top: 1px solid var(--line);
}

.card-h + .row, .card.tight .row:first-child, .row.first { border-top: 0; }
.row .g { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .g b { font-weight: 600; font-size: 14.5px; color: var(--ink); }
.row .g small { font-size: 13px; color: var(--ink-3); line-height: 1.35; }
a.row:hover { background: transparent; }

.lead {
  flex: none;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 13px;
  background: var(--pri-soft);
  color: var(--pri);
  font-size: 13px;
  font-weight: 700;
}

.lead.good { background: var(--good-bg); color: var(--good); }
.lead.warn { background: var(--warn-bg); color: var(--warn); }
.lead.bad { background: var(--bad-bg); color: var(--bad); }
.lead.neu { background: var(--neu-bg); color: var(--neu); }

.pill {
  display: inline-flex;
  align-items: center;
  height: 26px;
  padding: 0 11px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
  background: var(--neu-bg);
  color: var(--neu);
}

.pill.good { background: var(--good-bg); color: var(--good); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.pri { background: var(--pri-soft); color: var(--pri); }

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 52px;
  padding: 0 18px;
  border-radius: 16px;
  border: 1.5px solid var(--pri);
  background: var(--pri);
  color: #ffffff;
  font-weight: 700;
  font-size: 16px;

(function() {
  function fitDevice() {
    const stage = document.querySelector('.device-stage');
    if (!stage) return;
    const availW = window.innerWidth - 32;
    const availH = window.innerHeight - 36;
    const targetW = 460; // Outer chassis width
    const targetH = 976; // Outer chassis height
    
    // Fit cleanly inside viewport, occupying 60% to 85% on desktop
    let scale = Math.min(availW / targetW, availH / targetH);
    if (window.innerHeight > 1150) {
      scale = Math.min(scale, 0.88);
    }
    scale = Math.min(Math.max(scale, 0.28), 1.05);
    stage.style.transform = `scale(${scale})`;
  }
  window.addEventListener('resize', fitDevice);
  window.addEventListener('DOMContentLoaded', fitDevice);
  fitDevice();
})();

    return { date: g('year') + '-' + g('month') + '-' + g('day'), min: h * 60 + (+g('minute')) };
  } catch (e) {
    const d = new Date();
    return { date: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()), min: d.getHours() * 60 + d.getMinutes() };
  }
}

function prng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function mergeR(rs) {
  const a = rs.filter(r => r[1] > r[0]).map(r => [r[0], r[1]]).sort((x, y) => x[0] - y[0]);
  const out = [];
  for (const r of a) { const l = out[out.length - 1]; if (l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else out.push(r); }
  return out;
}
function subtractR(rs, cuts) {
  let cur = mergeR(rs);
  for (const c of mergeR(cuts)) {
    const next = [];
    for (const r of cur) {
      if (c[1] <= r[0] || c[0] >= r[1]) { next.push(r); continue; }
      if (c[0] > r[0]) next.push([r[0], c[0]]);
      if (c[1] < r[1]) next.push([c[1], r[1]]);
    }
    cur = next;
  }
  return cur;
}

  const out = [];
  for (const r of mergeR(rs)) for (const o of mergeR(others)) { const s = Math.max(r[0], o[0]), e = Math.min(r[1], o[1]); if (e > s) out.push([s, e]); }

}

function createEngine(db) {
  const by = (arr, id) => arr.find(x => x.id === id);
  const E = {};
  E.nid = p => { db.seq[p] = (db.seq[p] || 0) + 1; return p + '-' + db.seq[p]; };
  E.shift = id => by(db.shifts, id);
  E.vendor = id => by(db.vendors, id);
  E.emp = id => by(db.employees, id);
  E.guest = id => by(db.guests, id);
  E.meal = id => by(db.mealTypes, id) || { id, code: id, name: id };
  E.site = id => by(db.sites, id) || { id, code: id, name: id };
  E.user = id => { for (const v of db.vendors) { const u = v.users.find(x => x.id === id); if (u) return u; } return db.admins.find(a => a.id === id) || db.employees.find(x => x.id === id); };
  E.rosterLine = (emp, d) => db.roster.find(l => l.emp === emp && l.date === d);
  E.shiftRange = line => {
    const s = E.shift(line.shift); if (!s) return null;
    const base = dayNum(line.date) * 1440;
    if (s.end <= s.start) return [base - 1440 + s.start, base + s.end];
    return [base + s.start, base + s.end];
  };
  E.windowAbs = (D, from, to) => { const b = dayNum(D) * 1440; return to <= from ? [b + from, b + 1440 + to] : [b + from, b + to]; };
  E.shiftText = id => { const s = E.shift(id); return s ? s.code + ' ' + hhmm(s.start) + '–' + hhmm(s.end) : id; };

  E.freeDay = (emp, D) => {
    const lv = db.leaves.find(l => l.emp === emp && l.date === D && l.kind === 'full' && l.state === 'approved');
    if (lv) return { free: true, why: 'Approved full-day leave', leave: lv };
    const line = E.rosterLine(emp, D);
    if (!line || (line.shift !== 'WO' && !E.shift(line.shift))) return { free: true, why: 'Not rostered on ' + fmtDate(D) };
    if (line.shift === 'WO') return { free: true, why: 'Weekly off', line };
    return { free: false, line };
  };

  E.duty = (emp, D) => {
    const days = [addDays(D, -1), D, addDays(D, 1)];
    const parts = [], cuts = [];
    for (const d of days) {
      const line = E.rosterLine(emp, d);
      if (line && line.shift !== 'WO' && E.shift(line.shift)) { const r = E.shiftRange(line); parts.push({ kind: 'shift', s: r[0], e: r[1], line }); }
    }
    for (const x of db.extensions) if (x.emp === emp && x.state === 'approved' && days.includes(x.date)) { const r = E.windowAbs(x.date, x.from, x.to); parts.push({ kind: x.kind === 'OT' ? 'ot' : 'ext', s: r[0], e: r[1], rec: x }); }
    for (const l of db.leaves) if (l.emp === emp && l.state === 'approved' && l.kind === 'partial' && days.includes(l.date)) { const r = E.windowAbs(l.date, l.from, l.to); cuts.push({ kind: 'leave', s: r[0], e: r[1], rec: l }); }
    const ranges = subtractR(parts.map(p => [p.s, p.e]), cuts.map(c => [c.s, c.e]));
    return { parts, cuts, ranges };
  };

  E.mealLineAt = (v, min) => v.meals.find(m => m.start <= min && min < m.end);
  E.takenBy = (key, val, meal, date) => db.transactions.find(t => t.state === 'done' && t[key] === val && t.meal === meal && t.mealDate === date);
  E.dayRanges = (ranges, D) => { const b = dayNum(D) * 1440; return ranges.filter(r => r[1] > b && r[0] < b + 1440); };

  E.message = (code, r) => {
    const mt = r.meal ? E.meal(r.meal).name : 'Meal';
    const ml = r.mealLine;
    switch (code) {
      case 'INVALID_QR': return 'This QR code is not a valid canteen code.';
      case 'NOT_FOOD_USER': return 'You are not enabled for the food facility.';
      case 'NO_MEAL_WINDOW': return 'No meal is being served at this counter now.';
      case 'ALREADY_TAKEN': return 'You have already taken ' + mt.toLowerCase() + ' today at ' + E.vendor(r.prev.vendor).name + '.';
      case 'NOT_OPTED': return 'You have not opted for ' + mt.toLowerCase() + '. Pay ' + money(ml.rate) + ' at the counter.';
      case 'FREE_DAY': case 'OFF_DUTY': case 'ON_DUTY_AT_SITE': return mt + ' approved. Enjoy your meal.';
      case 'ON_DUTY': return 'You are on shift until ' + absLabel(r.cover[1], r.date) + '. This canteen serves off-duty staff.';
      case 'FREE_DAY_AT_SITE': return 'This canteen serves staff on shift. You are not on duty today.';
      case 'OFF_DUTY_AT_SITE': { const dr = E.dayRanges(r.duty.ranges, r.date); return 'This canteen serves staff on shift. ' + (dr.length ? 'Your duty today is ' + dr.map(x => rangeLabel(x, r.date)).join(', ') + '.' : 'You have no duty today.'); }
      case 'GUEST_ENTITLED': return mt + ' approved for the guest.';
      case 'GUEST_NOT_OPTED': return 'Guest has not opted for ' + mt.toLowerCase() + '. Collect ' + money(ml.rate) + '.';
      case 'GUEST_ALREADY_TAKEN': return 'Guest has already taken ' + mt.toLowerCase() + ' today at ' + E.vendor(r.prev.vendor).name + '.';
      case 'GUEST_NOT_VALID': return 'Guest pass is not valid today.';
      default: return code;
    }
  };

  E.shortReason = r => {
    switch (r.code) {
      case 'ON_DUTY': return 'On shift until ' + absLabel(r.cover[1], r.date);
      case 'OFF_DUTY_AT_SITE': return 'Not on shift now';
      case 'FREE_DAY_AT_SITE': return (r.free && r.free.why ? r.free.why : 'Not on duty today');
      case 'NO_MEAL_WINDOW': return 'No meal now';
      case 'ALREADY_TAKEN': return 'Already taken';
      default: return r.code;
    }
  };

  E.evaluateScan = ({ empId, token, date, min, manual }) => {
    const trace = [], at = dayNum(date) * 1440 + min;
    const res = { kind: 'scan', manual: !!manual, empId, token, date, min, at, trace };
    const done = (result, code) => { res.result = result; res.code = code; res.message = E.message(code, res); return res; };
    const v = db.vendors.find(x => x.qrToken === String(token || '').trim());
    if (!v || !v.active) { trace.push({ ok: false, label: 'Valid vendor QR', detail: v ? v.name + ' is inactive' : 'Token not recognised' }); return done('rejected', 'INVALID_QR'); }
    res.vendorId = v.id;
    trace.push({ ok: true, label: 'Valid vendor QR', detail: v.name + ', ' + E.site(v.siteId).name });
    const emp = E.emp(empId);
    if (!emp || !emp.food) { trace.push({ ok: false, label: 'Food facility enabled', detail: 'Food facility is off for this employee' }); return done('rejected', 'NOT_FOOD_USER'); }
    trace.push({ ok: true, label: 'Food facility enabled', detail: emp.code + ' ' + emp.name });
    const ml = E.mealLineAt(v, min);
    if (!ml) { trace.push({ ok: false, label: 'Scan time inside a meal window', detail: hhmm(min) + ' is outside ' + (v.meals.map(m => E.meal(m.meal).name + ' ' + hhmm(m.start) + '–' + hhmm(m.end)).join(', ') || 'any meal line') }); return done('rejected', 'NO_MEAL_WINDOW'); }
    res.mealLine = ml; res.meal = ml.meal;
    trace.push({ ok: true, label: 'Scan time inside a meal window', detail: E.meal(ml.meal).name + ' ' + hhmm(ml.start) + '–' + hhmm(ml.end) + ', scanned ' + hhmm(min) });
    const prev = E.takenBy('emp', emp.id, ml.meal, date);
    if (prev) { res.prev = prev; trace.push({ ok: false, label: 'Meal not taken yet today', detail: 'Taken at ' + E.vendor(prev.vendor).name + ' at ' + hhmm(prev.min) + ' (' + prev.ref + ')' }); return done('rejected', 'ALREADY_TAKEN'); }
    trace.push({ ok: true, label: 'Meal not taken yet today', detail: 'Checked across every vendor' });
    if (!emp.optins.includes(ml.meal)) { trace.push({ ok: false, label: 'Opted for this meal', detail: 'Not in standing opt-in, charged at ' + money(ml.rate) }); return done('chargeable', 'NOT_OPTED'); }
    trace.push({ ok: true, label: 'Opted for this meal', detail: 'Standing opt-in' });
    const fd = E.freeDay(emp.id, date), du = E.duty(emp.id, date);
    const cover = du.ranges.find(r => r[0] <= at && at < r[1]);
    Object.assign(res, { free: fd, duty: du, cover });
    trace.push({ ok: null, label: 'Vendor type', detail: v.atSite ? 'At-site canteen: serves employees on duty' : 'Off-site canteen: serves employees off duty' });
    const tFree = { ok: null, label: 'Free day', detail: fd.free ? 'Yes, ' + fd.why.toLowerCase() : 'No, rostered ' + E.shiftText(fd.line.shift) };
    const dr = E.dayRanges(du.ranges, date);
    const tDuty = { ok: null, label: 'On duty at scan time', detail: cover ? 'Yes, duty ' + rangeLabel(cover, date) : 'No' + (dr.length ? ', duty ' + dr.map(x => rangeLabel(x, date)).join(', ') : '') };
    trace.push(tFree);
    if (!v.atSite) {
      if (fd.free) { tFree.ok = true; return done('entitled', 'FREE_DAY'); }
      trace.push(tDuty);
      if (cover) { tDuty.ok = false; return done('blocked', 'ON_DUTY'); }
      tDuty.ok = true; return done('entitled', 'OFF_DUTY');
    }
    if (fd.free) { tFree.ok = false; return done('blocked', 'FREE_DAY_AT_SITE'); }
    trace.push(tDuty);
    if (cover) { tDuty.ok = true; return done('entitled', 'ON_DUTY_AT_SITE'); }

    const trace = [];

    const done = (result, code) => { res.result = result; res.code = code; res.message = E.message(code, res); return res; };
    const g = E.guest(guestId), v = E.vendor(vendorId);
    if (!g || !(g.from <= date && date <= g.to)) { trace.push({ ok: false, label: 'Guest valid today', detail: g ? fmtDate(g.from) + ' to ' + fmtDate(g.to) : 'Unknown guest' }); return done('rejected', 'GUEST_NOT_VALID'); }
    trace.push({ ok: true, label: 'Guest valid today', detail: fmtDate(g.from) + ' to ' + fmtDate(g.to) });
    const ml = E.mealLineAt(v, min);
    if (!ml) { trace.push({ ok: false, label: 'Meal being served now', detail: hhmm(min) + ' is outside this vendor\'s timings' }); return done('rejected', 'NO_MEAL_WINDOW'); }
    res.mealLine = ml; res.meal = ml.meal;
    trace.push({ ok: true, label: 'Meal being served now', detail: E.meal(ml.meal).name + ' ' + hhmm(ml.start) + '–' + hhmm(ml.end) });
    const prev = E.takenBy('guest', g.id, ml.meal, date);
    if (prev) { res.prev = prev; trace.push({ ok: false, label: 'Meal not taken yet today', detail: 'Taken at ' + E.vendor(prev.vendor).name + ' (' + prev.ref + ')' }); return done('rejected', 'GUEST_ALREADY_TAKEN'); }
    trace.push({ ok: true, label: 'Meal not taken yet today', detail: 'Checked across every vendor' });
    if (!g.meals.includes(ml.meal)) { trace.push({ ok: false, label: 'Opted for this meal', detail: 'Chargeable at ' + money(ml.rate) }); return done('chargeable', 'GUEST_NOT_OPTED'); }
    trace.push({ ok: true, label: 'Opted for this meal', detail: 'On the guest list' });
    return done('entitled', 'GUEST_ENTITLED');

  E.createTx = (res, by) => {
    const v = E.vendor(res.vendorId), site = E.site(v.siteId);

    const seq = (db.seq['tx-' + dateTag] = (db.seq['tx-' + dateTag] || 0) + 1);

      vendor: v.id, vendorAtSite: v.atSite, siteId: v.siteId, meal: res.meal, mealLineId: res.mealLine && res.mealLine.id,
      rate: res.mealLine ? res.mealLine.rate : 0, status: res.result === 'chargeable' ? 'chargeable' : 'entitled',
      source: res.manual ? 'manual_code' : by ? 'counter_mark' : 'qr_scan', by: by || null,
      emp: res.empId || null, guest: res.guestId || null, shift: res.cover && res.cover.line ? res.cover.line.shift : null,
      dutyStart: res.cover ? res.cover[0] : null, dutyEnd: res.cover ? res.cover[1] : null, createdAt: Date.now()

  E.commit = (res, by) => {
    const log = { id: E.nid('log'), date: res.date, min: res.min, at: res.at, kind: res.kind, emp: res.empId || null, guest: res.guestId || null, vendor: res.vendorId || null, meal: res.meal || null, result: res.result, code: res.code, message: res.message, token: res.token || null, manual: res.manual || false, by: by || null, trace: res.trace, createdAt: Date.now() };

  E.shiftSegs = s => {
    if (!s) return [];

  };

  E.eligibleSegs = (empId, v, ml, D) => {

      }

    }
  };
  E.mapStale = v => db.map.sigs[v.id] !== E.sig(v);

  return E;
}

    try { UI.torchOk = !!(track.getCapabilities && track.getCapabilities().torch); } catch (e) { UI.torchOk = false; }
    if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; } }
    if (!detector) { try { await loadJsQR(); } catch (e) { setCamStatus('live'); setCamStatus('error', 'The camera is on, but the QR reader could not load. Use Enter code, or pick your counter below.'); const c = document.querySelector('.cam'); c && c.classList.add('live'); return; } }
    setCamStatus('live');
    const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
    let last = 0, busy = false;
    const tick = async t => {
      if (!stream) return;
      rafId = requestAnimationFrame(tick);
      if (busy || t - last < 180 || video.readyState < 2) return;
      last = t; busy = true;
      try {
        let text = null;
        if (detector) { const codes = await detector.detect(video); if (codes.length) text = codes[0].rawValue; }
        else if (window.jsQR) {
          const w = Math.min(640, video.videoWidth), h = Math.round(video.videoHeight * (w / video.videoWidth));
          canvas.width = w; canvas.height = h; ctx.drawImage(video, 0, 0, w, h);
          const code = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
          if (code) text = code.data;
        }
        if (text) { const f = document.querySelector('.frame'); f && f.classList.add('hit'); if (navigator.vibrate) navigator.vibrate(60); stopCamera(); setTimeout(() => handleToken(text), 250); }
      } catch (e) { }
      busy = false;
    };
    rafId = requestAnimationFrame(tick);
  } catch (err) {
    stopCamera();
    if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) { UI.camDenied = true; setCamStatus('error', 'Camera access is blocked for this page. Allow the camera in your browser or phone settings, or use Enter code or Pick counter.'); return; }
    setCamStatus('error', err && err.name === 'NotFoundError' ? 'No camera was found on this device. Use Enter code, or pick your counter below.' : 'The camera could not start in this view. Use Enter code, or pick your counter below.');
  }
}
async function toggleTorch() {
  if (!stream) return; const track = stream.getVideoTracks()[0];
  try { UI.torch = !UI.torch; await track.applyConstraints({ advanced: [{ torch: UI.torch }] }); const b = document.getElementById('torch-btn'); b && b.classList.toggle('on', UI.torch); } catch (e) { toast('The torch is not available on this camera.'); }
}
function handleToken(raw) {
  const text = String(raw || '').trim();
  const m = /FUQR-[A-Z0-9]{10}/i.exec(text);
  UI.pending = { token: (m ? m[0] : text).toUpperCase(), at: Date.now() };
