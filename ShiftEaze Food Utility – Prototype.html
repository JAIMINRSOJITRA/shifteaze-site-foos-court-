      table.cards,
      table.cards tbody,
      table.cards tr,
      table.cards td {
        display: block;
        width: 100%;
      }

      table.cards tr {
        border-bottom: 1px solid var(--line);
        padding: 10px 14px;
      }

      table.cards td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 0 !important;
        padding: 4px 0 !important;
      }

      table.cards td::before {
        content: attr(data-label);
        color: var(--ink-2);
        font-size: 12.5px;
        font-weight: 600;
      }

      .demo-acc {
        flex-wrap: wrap;
      }

      .demo-acc .chips {
        justify-content: flex-start !important;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script>
    (function (root) {
      'use strict';
      const pad = n => String(n).padStart(2, '0');
      const toMin = s => { if (typeof s === 'number') return s; const m = /^(\d{1,2}):(\d{2})/.exec(String(s || '').trim()); if (!m) return NaN; return (+m[1]) * 60 + (+m[2]); };
      const hhmm = m => { if (m === 1440) return '24:00'; m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
      const dayNum = d => Math.round(Date.parse(d + 'T00:00:00Z') / 864e5);
      const dateOf = n => new Date(n * 864e5).toISOString().slice(0, 10);
      const addDays = (d, k) => dateOf(dayNum(d) + k);
      const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const utc = d => new Date(dayNum(d) * 864e5);
      const fmtDate = d => { const t = utc(d); return t.getUTCDate() + ' ' + MONTHS[t.getUTCMonth()] + ' ' + t.getUTCFullYear(); };
      const fmtDay = d => { const t = utc(d); return t.getUTCDate() + ' ' + MONTHS[t.getUTCMonth()]; };
      const weekday = d => WEEKDAYS[utc(d).getUTCDay()];
      const mondayOf = d => { const w = utc(d).getUTCDay(); return addDays(d, -((w + 6) % 7)); };
      const absLabel = (a, D) => { const n = Math.floor(a / 1440), m = a - n * 1440; const t = hhmm(m); return (D && n !== dayNum(D)) ? t + ' (' + fmtDay(dateOf(n)) + ')' : t; };
      const rangeLabel = (r, D) => absLabel(r[0], D) + '–' + absLabel(r[1], D);
      const money = n => '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });

      function istNow() {
        try {
          const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date());
          const g = t => (parts.find(p => p.type === t) || {}).value;
          let h = +g('hour'); if (h === 24) h = 0;
          return { date: g('year') + '-' + g('month') + '-' + g('day'), min: h * 60 + (+g('minute')) };
        } catch (e) {
          const d = new Date();
          return { date: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()), min: d.getHours() * 60 + d.getMinutes() };
        }
      }

      function prng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

      function mergeR(rs) {
        const a = rs.filter(r => r[1] > r[0]).map(r => [r[0], r[1]]).sort((x, y) => x[0] - y[0]);
        const out = [];
        for (const r of a) { const l = out[out.length - 1]; if (l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else out.push(r); }
        return out;
      }
      function subtractR(rs, cuts) {
        let cur = mergeR(rs);
        for (const c of mergeR(cuts)) {
          const next = [];
          for (const r of cur) {
            if (c[1] <= r[0] || c[0] >= r[1]) { next.push(r); continue; }
            if (c[0] > r[0]) next.push([r[0], c[0]]);
            if (c[1] < r[1]) next.push([c[1], r[1]]);
          }
          cur = next;
        }
        return cur;
      }
      function intersectR(rs, others) {
        const out = [];
        for (const r of mergeR(rs)) for (const o of mergeR(others)) { const s = Math.max(r[0], o[0]), e = Math.min(r[1], o[1]); if (e > s) out.push([s, e]); }
        return mergeR(out);
      }

      function createEngine(db) {
        const by = (arr, id) => arr.find(x => x.id === id);
        const E = {};
        E.nid = p => { db.seq[p] = (db.seq[p] || 0) + 1; return p + '-' + db.seq[p]; };
        E.shift = id => by(db.shifts, id);
        E.vendor = id => by(db.vendors, id);
        E.emp = id => by(db.employees, id);
        E.guest = id => by(db.guests, id);
        E.meal = id => by(db.mealTypes, id) || { id, code: id, name: id };
        E.site = id => by(db.sites, id) || { id, code: id, name: id };
        E.user = id => { for (const v of db.vendors) { const u = v.users.find(x => x.id === id); if (u) return u; } return db.admins.find(a => a.id === id) || db.employees.find(x => x.id === id); };
        E.rosterLine = (emp, d) => db.roster.find(l => l.emp === emp && l.date === d);
        E.shiftRange = line => {
          const s = E.shift(line.shift); if (!s) return null;
          const base = dayNum(line.date) * 1440;
          if (s.end <= s.start) return [base - 1440 + s.start, base + s.end];
          return [base + s.start, base + s.end];
        };
        E.windowAbs = (D, from, to) => { const b = dayNum(D) * 1440; return to <= from ? [b + from, b + 1440 + to] : [b + from, b + to]; };
        E.shiftText = id => { const s = E.shift(id); return s ? s.code + ' ' + hhmm(s.start) + '–' + hhmm(s.end) : id; };

        E.freeDay = (emp, D) => {
          const lv = db.leaves.find(l => l.emp === emp && l.date === D && l.kind === 'full' && l.state === 'approved');
          if (lv) return { free: true, why: 'Approved full-day leave', leave: lv };
          const line = E.rosterLine(emp, D);
          if (!line || (line.shift !== 'WO' && !E.shift(line.shift))) return { free: true, why: 'Not rostered on ' + fmtDate(D) };
          if (line.shift === 'WO') return { free: true, why: 'Weekly off', line };
          return { free: false, line };
        };

        E.duty = (emp, D) => {
          const days = [addDays(D, -1), D, addDays(D, 1)];
          const parts = [], cuts = [];
          for (const d of days) {
            const line = E.rosterLine(emp, d);
            if (line && line.shift !== 'WO' && E.shift(line.shift)) { const r = E.shiftRange(line); parts.push({ kind: 'shift', s: r[0], e: r[1], line }); }
          }
          for (const x of db.extensions) if (x.emp === emp && x.state === 'approved' && days.includes(x.date)) { const r = E.windowAbs(x.date, x.from, x.to); parts.push({ kind: x.kind === 'OT' ? 'ot' : 'ext', s: r[0], e: r[1], rec: x }); }
          for (const l of db.leaves) if (l.emp === emp && l.state === 'approved' && l.kind === 'partial' && days.includes(l.date)) { const r = E.windowAbs(l.date, l.from, l.to); cuts.push({ kind: 'leave', s: r[0], e: r[1], rec: l }); }
          const ranges = subtractR(parts.map(p => [p.s, p.e]), cuts.map(c => [c.s, c.e]));
          return { parts, cuts, ranges };
        };

        E.mealLineAt = (v, min) => v.meals.find(m => m.start <= min && min < m.end);
        E.takenBy = (key, val, meal, date) => db.transactions.find(t => t.state === 'done' && t[key] === val && t.meal === meal && t.mealDate === date);
        E.dayRanges = (ranges, D) => { const b = dayNum(D) * 1440; return ranges.filter(r => r[1] > b && r[0] < b + 1440); };

        E.message = (code, r) => {
          const mt = r.meal ? E.meal(r.meal).name : 'Meal';
          const ml = r.mealLine;
          switch (code) {
            case 'INVALID_QR': return 'This QR code is not a valid canteen code.';
            case 'NOT_FOOD_USER': return 'You are not enabled for the food facility.';
            case 'NO_MEAL_WINDOW': return 'No meal is being served at this counter now.';
            case 'ALREADY_TAKEN': return 'You have already taken ' + mt.toLowerCase() + ' today at ' + E.vendor(r.prev.vendor).name + '.';
            case 'NOT_OPTED': return 'You have not opted for ' + mt.toLowerCase() + '. Pay ' + money(ml.rate) + ' at the counter.';
            case 'FREE_DAY': case 'OFF_DUTY': case 'ON_DUTY_AT_SITE': return mt + ' approved. Enjoy your meal.';
            case 'ON_DUTY': return 'You are on shift until ' + absLabel(r.cover[1], r.date) + '. This canteen serves off-duty staff.';
            case 'FREE_DAY_AT_SITE': return 'This canteen serves staff on shift. You are not on duty today.';
            case 'OFF_DUTY_AT_SITE': { const dr = E.dayRanges(r.duty.ranges, r.date); return 'This canteen serves staff on shift. ' + (dr.length ? 'Your duty today is ' + dr.map(x => rangeLabel(x, r.date)).join(', ') + '.' : 'You have no duty today.'); }
            case 'GUEST_ENTITLED': return mt + ' approved for the guest.';
            case 'GUEST_NOT_OPTED': return 'Guest has not opted for ' + mt.toLowerCase() + '. Collect ' + money(ml.rate) + '.';
            case 'GUEST_ALREADY_TAKEN': return 'Guest has already taken ' + mt.toLowerCase() + ' today at ' + E.vendor(r.prev.vendor).name + '.';
            case 'GUEST_NOT_VALID': return 'Guest pass is not valid today.';
            default: return code;
          }
        };

        E.shortReason = r => {
          switch (r.code) {
            case 'ON_DUTY': return 'On shift until ' + absLabel(r.cover[1], r.date);
            case 'OFF_DUTY_AT_SITE': return 'Not on shift now';
            case 'FREE_DAY_AT_SITE': return (r.free && r.free.why ? r.free.why : 'Not on duty today');
            case 'NO_MEAL_WINDOW': return 'No meal now';
            case 'ALREADY_TAKEN': return 'Already taken';
            default: return r.code;
          }
        };

        E.evaluateScan = ({ empId, token, date, min, manual }) => {
          const trace = [], at = dayNum(date) * 1440 + min;
          const res = { kind: 'scan', manual: !!manual, empId, token, date, min, at, trace };
          const done = (result, code) => { res.result = result; res.code = code; res.message = E.message(code, res); return res; };
          const v = db.vendors.find(x => x.qrToken === String(token || '').trim());
          if (!v || !v.active) { trace.push({ ok: false, label: 'Valid vendor QR', detail: v ? v.name + ' is inactive' : 'Token not recognised' }); return done('rejected', 'INVALID_QR'); }
          res.vendorId = v.id;
          trace.push({ ok: true, label: 'Valid vendor QR', detail: v.name + ', ' + E.site(v.siteId).name });
          const emp = E.emp(empId);
          if (!emp || !emp.food) { trace.push({ ok: false, label: 'Food facility enabled', detail: 'Food facility is off for this employee' }); return done('rejected', 'NOT_FOOD_USER'); }
          trace.push({ ok: true, label: 'Food facility enabled', detail: emp.code + ' ' + emp.name });
          const ml = E.mealLineAt(v, min);
          if (!ml) { trace.push({ ok: false, label: 'Scan time inside a meal window', detail: hhmm(min) + ' is outside ' + (v.meals.map(m => E.meal(m.meal).name + ' ' + hhmm(m.start) + '–' + hhmm(m.end)).join(', ') || 'any meal line') }); return done('rejected', 'NO_MEAL_WINDOW'); }
          res.mealLine = ml; res.meal = ml.meal;
          trace.push({ ok: true, label: 'Scan time inside a meal window', detail: E.meal(ml.meal).name + ' ' + hhmm(ml.start) + '–' + hhmm(ml.end) + ', scanned ' + hhmm(min) });
          const prev = E.takenBy('emp', emp.id, ml.meal, date);
          if (prev) { res.prev = prev; trace.push({ ok: false, label: 'Meal not taken yet today', detail: 'Taken at ' + E.vendor(prev.vendor).name + ' at ' + hhmm(prev.min) + ' (' + prev.ref + ')' }); return done('rejected', 'ALREADY_TAKEN'); }
          trace.push({ ok: true, label: 'Meal not taken yet today', detail: 'Checked across every vendor' });
          if (!emp.optins.includes(ml.meal)) { trace.push({ ok: false, label: 'Opted for this meal', detail: 'Not in standing opt-in, charged at ' + money(ml.rate) }); return done('chargeable', 'NOT_OPTED'); }
          trace.push({ ok: true, label: 'Opted for this meal', detail: 'Standing opt-in' });
          const fd = E.freeDay(emp.id, date), du = E.duty(emp.id, date);
          const cover = du.ranges.find(r => r[0] <= at && at < r[1]);
          Object.assign(res, { free: fd, duty: du, cover });
          trace.push({ ok: null, label: 'Vendor type', detail: v.atSite ? 'At-site canteen: serves employees on duty' : 'Off-site canteen: serves employees off duty' });
          const tFree = { ok: null, label: 'Free day', detail: fd.free ? 'Yes, ' + fd.why.toLowerCase() : 'No, rostered ' + E.shiftText(fd.line.shift) };
          const dr = E.dayRanges(du.ranges, date);
          const tDuty = { ok: null, label: 'On duty at scan time', detail: cover ? 'Yes, duty ' + rangeLabel(cover, date) : 'No' + (dr.length ? ', duty ' + dr.map(x => rangeLabel(x, date)).join(', ') : '') };
          trace.push(tFree);
          if (!v.atSite) {
            if (fd.free) { tFree.ok = true; return done('entitled', 'FREE_DAY'); }
            trace.push(tDuty);
            if (cover) { tDuty.ok = false; return done('blocked', 'ON_DUTY'); }
            tDuty.ok = true; return done('entitled', 'OFF_DUTY');
          }
          if (fd.free) { tFree.ok = false; return done('blocked', 'FREE_DAY_AT_SITE'); }
          trace.push(tDuty);
          if (cover) { tDuty.ok = true; return done('entitled', 'ON_DUTY_AT_SITE'); }
          tDuty.ok = false; return done('blocked', 'OFF_DUTY_AT_SITE');
        };

        E.evaluateGuest = ({ guestId, vendorId, date, min }) => {
          const trace = [];
          const res = { kind: 'guest', guestId, vendorId, date, min, at: dayNum(date) * 1440 + min, trace };
          const done = (result, code) => { res.result = result; res.code = code; res.message = E.message(code, res); return res; };
          const g = E.guest(guestId), v = E.vendor(vendorId);
          if (!g || !(g.from <= date && date <= g.to)) { trace.push({ ok: false, label: 'Guest valid today', detail: g ? fmtDate(g.from) + ' to ' + fmtDate(g.to) : 'Unknown guest' }); return done('rejected', 'GUEST_NOT_VALID'); }
          trace.push({ ok: true, label: 'Guest valid today', detail: fmtDate(g.from) + ' to ' + fmtDate(g.to) });
          const ml = E.mealLineAt(v, min);
          if (!ml) { trace.push({ ok: false, label: 'Meal being served now', detail: hhmm(min) + ' is outside this vendor\'s timings' }); return done('rejected', 'NO_MEAL_WINDOW'); }
          res.mealLine = ml; res.meal = ml.meal;
          trace.push({ ok: true, label: 'Meal being served now', detail: E.meal(ml.meal).name + ' ' + hhmm(ml.start) + '–' + hhmm(ml.end) });
          const prev = E.takenBy('guest', g.id, ml.meal, date);
          if (prev) { res.prev = prev; trace.push({ ok: false, label: 'Meal not taken yet today', detail: 'Taken at ' + E.vendor(prev.vendor).name + ' (' + prev.ref + ')' }); return done('rejected', 'GUEST_ALREADY_TAKEN'); }
          trace.push({ ok: true, label: 'Meal not taken yet today', detail: 'Checked across every vendor' });
          if (!g.meals.includes(ml.meal)) { trace.push({ ok: false, label: 'Opted for this meal', detail: 'Chargeable at ' + money(ml.rate) }); return done('chargeable', 'GUEST_NOT_OPTED'); }
          trace.push({ ok: true, label: 'Opted for this meal', detail: 'On the guest list' });
          return done('entitled', 'GUEST_ENTITLED');
        };

        E.createTx = (res, by) => {
          const v = E.vendor(res.vendorId), site = E.site(v.siteId);
          const seq = db.transactions.filter(t => t.site === site.id && t.mealDate === res.date).length + 1;
          const ref = 'FD-' + site.code + '-' + res.date.slice(2).replace(/-/g, '') + '-' + String(seq).padStart(5, '0');
          let rosterLine = null, shift = null, dutyStart = null, dutyEnd = null;
          if (res.kind === 'scan' && res.free) {
            const line = res.free.line;
            if (line && line.shift !== 'WO') { rosterLine = line.id; shift = line.shift; const r = E.shiftRange(line); if (r) { dutyStart = r[0]; dutyEnd = r[1]; } }
            if (res.cover) { dutyStart = res.cover[0]; dutyEnd = res.cover[1]; }
          }
          const tx = {
            id: E.nid('tx'), ref, consumer: res.kind === 'guest' ? 'guest' : 'employee',
            emp: res.kind === 'scan' ? res.empId : null, guest: res.kind === 'guest' ? res.guestId : null,
            vendor: v.id, site: site.id, meal: res.meal, date: res.date, min: res.min, mealDate: res.date,
            vendorAtSite: v.atSite, status: res.result, code: res.code, rate: res.mealLine.rate,
            source: res.kind === 'guest' || res.manual ? 'vendor_mark' : 'qr_scan', rosterLine, shift, dutyStart, dutyEnd,
            markedBy: by || null, state: 'done', cancelReason: null
          };
          db.transactions.push(tx);
          return tx;
        };

        E.commit = (res, by) => {
          if (res.result === 'entitled' || res.result === 'chargeable') return { tx: E.createTx(res, by) };
          const log = { id: E.nid('log'), consumer: res.kind === 'guest' ? 'guest' : 'employee', emp: res.empId || null, guest: res.guestId || null, vendor: res.vendorId || null, token: res.token || null, date: res.date, min: res.min, result: res.result, code: res.code, message: res.message, by: by || null };
          db.scanLog.push(log);
          return { log };
        };

        E.eligibleSegs = (empId, v, ml, D) => {
          const w = E.windowAbs(D, ml.start, ml.end);
          const fd = E.freeDay(empId, D);
          if (fd.free) return v.atSite ? [] : [w];
          const du = E.duty(empId, D).ranges;
          return v.atSite ? intersectR([w], du) : subtractR([w], du);
        };

        E.expected = (siteId, meal, D, vendorIds) => {
          const vendors = db.vendors.filter(v => v.active && (!siteId || v.siteId === siteId) && (!vendorIds || vendorIds.includes(v.id)));
          let emp = 0;
          for (const e of db.employees) {
            if (!e.food || !e.optins.includes(meal) || (siteId && e.siteId !== siteId)) continue;
            const ok = vendors.filter(v => v.siteId === e.siteId).some(v => { const ml = v.meals.find(m => m.meal === meal); return ml && E.eligibleSegs(e.id, v, ml, D).length > 0; });
            if (ok) emp++;
          }
          const guests = db.guests.filter(g => g.from <= D && D <= g.to && g.meals.includes(meal)).length;
          return { emp, guests };
        };

        E.sig = v => JSON.stringify({ a: v.atSite, m: v.meals.map(m => [m.meal, m.start, m.end]), s: db.shifts.map(s => [s.id, s.start, s.end]) });
        E.shiftSegs = s => s.end <= s.start ? [[s.start, 1440], [0, s.end]] : [[s.start, s.end]];
        E.buildMap = vendorIds => {
          const ids = vendorIds || db.vendors.map(v => v.id);
          db.map.rows = db.map.rows.filter(r => !ids.includes(r.vendor));
          for (const id of ids) {
            const v = E.vendor(id); if (!v) continue;
            for (const s of db.shifts) for (const ml of v.meals) {
              const w = [[ml.start, ml.end]];
              const segs = v.atSite ? intersectR(w, E.shiftSegs(s)) : subtractR(w, E.shiftSegs(s));
              db.map.rows.push({ id: E.nid('map'), vendor: v.id, shift: s.id, meal: ml.meal, atSite: v.atSite, segs, eligible: segs.length > 0 });
            }
            db.map.sigs[v.id] = E.sig(v);
          }
        };
        E.mapStale = v => db.map.sigs[v.id] !== E.sig(v);

        E.validateVendor = (v, isNew) => {
          const err = [];
          if (!v.code) err.push('Enter a vendor code.');
          else if (db.vendors.some(x => x.code.toLowerCase() === v.code.toLowerCase() && x.id !== v.id)) err.push('Vendor code ' + v.code + ' is already used.');
          if (!v.name) err.push('Enter a vendor name.');
          if (!v.siteId) err.push('Choose a site.');
          const seen = {};
          v.meals.forEach((m, i) => {
            const n = 'Meal line ' + (i + 1);
            if (!m.meal) err.push(n + ': choose a meal type.');
            else if (seen[m.meal]) err.push(n + ': ' + E.meal(m.meal).name + ' appears twice. One line per meal type.');
            seen[m.meal] = 1;
            if (isNaN(m.start) || isNaN(m.end)) err.push(n + ': enter start and end times.');
            else if (m.start >= m.end) err.push(n + ': start must be before end (windows cannot cross midnight).');
            if (!(m.rate >= 0)) err.push(n + ': enter a rate of 0 or more.');
          });
          const ms = v.meals.filter(m => m.start < m.end).slice().sort((a, b) => a.start - b.start);
          for (let i = 1; i < ms.length; i++) if (ms[i].start < ms[i - 1].end) err.push(E.meal(ms[i - 1].meal).name + ' and ' + E.meal(ms[i].meal).name + ' windows overlap.');
          if (v.active && !v.meals.length) err.push('Add at least one meal line before activating the vendor.');
          const emails = {};

        filter: '<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path d="M1 2h14l-5.5 6.5V14l-3-1.5V8.5z"/></svg>',
        pin: '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path d="M8 1a5 5 0 0 0-5 5c0 3.6 5 9 5 9s5-5.4 5-9a5 5 0 0 0-5-5zm0 7a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>',
        caret: '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" fill="currentColor"><path d="M1 3h8L5 8z"/></svg>',
        chat: '<svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true" fill="currentColor"><path d="M3 3h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H8l-4 3v-3H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M18 7v6a2 2 0 0 1-2 2h-1v2l-3-2h-2" opacity=".6"/></svg>',
        activity: '<svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="8"/><path d="M10 5v5l3 2" stroke-linecap="round"/></svg>',
        plate: '<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><circle cx="15" cy="16" r="7.5"/><circle cx="15" cy="16" r="4"/><path d="M4 6v6a2 2 0 0 0 2 2v9M6 6v5M8 6v6a2 2 0 0 1-2 2M25 6c-2 1-2.5 4-2.5 7h2.5v10"/></svg>'
      };

      /* ---------- routing and shell ---------- */
      const ADMIN_MENU = [
        { label: 'Dashboard', r: 'dashboard' },
        { label: 'Operations', items: [['tx', 'Live transactions'], ['log', 'Blocked and rejected scans'], ['sim', 'Scan test console']] },
        { label: 'Masters', items: [['vendors', 'Vendors'], ['mealtypes', 'Meal types'], ['shifts', 'Shift master'], ['vmenu', 'Weekly menu']] },
        { label: 'People', items: [['employees', 'Employees']] },
        { label: 'Guests', items: [['guestview', 'View Guests'], ['guestadd', 'Add Guest']] },
        { label: 'Roster data', items: [['roster', 'Roster'], ['leaves', 'Leave'], ['ext', 'OT and extensions']], hint: 'Read from ShiftEaze. Editable here for testing.' },
        { label: 'Reporting', items: [['billing', 'Monthly billing']] }
      ];
      const VADMIN_MENU = [
        { label: 'Dashboard', r: 'vdash' },
        { label: 'People', r: 'vpeople' },
        { label: 'Guests', r: 'guestview' },
        { label: 'Transactions', r: 'vhistory' },
        { label: 'Weekly menu', r: 'vmenu' },
        { label: 'Billing', r: 'vbill' }
      ];
      const COUNTER_MENU = [{ label: 'Guests', r: 'counter' }, { label: 'Served today', r: 'cserved' }];
      const EMPLOYEE_MENU = [
        { label: "Today's Meals", r: 'm' },
        { label: 'Scan Canteen QR', r: 'mscan' },
        { label: 'My Meals History', r: 'mmeals' },
        { label: 'Canteen Menu', r: 'mmenu' },
        { label: 'My Profile', r: 'mprofile' }
      ];
      const ROUTES = {
        admin: ['home', 'dashboard', 'tx', 'log', 'sim', 'vendors', 'vendor', 'mealtypes', 'shifts', 'map', 'employees', 'guests', 'guestadd', 'guestview', 'roster', 'leaves', 'ext', 'billing', 'vmenu', 'foodadmin'],
        vadmin: ['vdash', 'vpeople', 'vguests', 'guestview', 'vhistory', 'vmenu', 'vbill'],
        counter: ['counter', 'cserved'],
        employee: ['m', 'mscan', 'mresult', 'mmeals', 'mmenu', 'mprofile']
      };
      const HOME = { admin: 'home', vadmin: 'vdash', counter: 'counter', employee: 'm' };
      App.HOME = HOME;
      App.pages = {};
      function route() { const h = location.hash.replace(/^#\/?/, ''); const [name, arg] = h.split('/'); return { name: name || '', arg: arg ? decodeURIComponent(arg) : '' }; }
      function go(h) { if (location.hash === '#/' + h) render(); else location.hash = '#/' + h; }
      App.go = go;

      function clockPill() {
        const c = DB.settings.clock, n = now();
        return `<button class="clock ${c.live ? '' : 'test'}" data-act="clock" title="Change the clock used for scans"><span class="dot"></span><span>${c.live ? 'Live' : 'Test time'}</span><span class="txt-long">${weekday(n.date)} ${fmtDay(n.date)},</span><span>${hhmm(n.min)}</span></button>`;
      }
      function shell(content, r) {
        const S = App.S, isAdmin = S.role === 'admin';
        const home = isAdmin && r === 'home';
        const menu = isAdmin ? ADMIN_MENU : S.role === 'vadmin' ? VADMIN_MENU : S.role === 'employee' ? EMPLOYEE_MENU : COUNTER_MENU;
        const u = E.user(S.userId) || { name: '?' };
        const vend = (!isAdmin && S.role !== 'employee') ? vendorsOf()[0] : null;
        const items = home ? '' : menu.map((m, i) => {
          if (!m.items) {
            return `<a class="nav-btn ${r === m.r ? 'on' : ''}" href="#/${m.r}" data-act="go" data-to="${m.r}" style="display:flex;align-items:center;text-decoration:none">${m.label}</a>`;
          }
          const isOn = (m.r && r === m.r) || m.items.some(x => x[0] === r || (r === 'vendor' && x[0] === 'vendors'));
          return `<div class="dd" data-dd="${i}"><button type="button" class="nav-btn ${isOn ? 'on' : ''}" data-act="dd" aria-haspopup="true" style="display:flex;align-items:center;text-decoration:none;gap:4px;cursor:pointer">${m.label} <span style="font-size:9px;opacity:0.75">▼</span></button><div class="dd-menu">${m.hint ? `<div class="hint">${m.hint}</div>` : ''}${m.items.map(x => `<a href="#/${x[0]}" data-act="go" data-to="${x[0]}" class="${r === x[0] ? 'on' : ''}">${x[1]}</a>`).join('')}</div></div>`;
        }).join('');
        return `<header class="nav" id="nav">
    ${isAdmin ? `<button class="apps" data-act="goHome" aria-label="All apps">${IC.grid}</button>` : ''}
    ${!home ? `<button class="apps burger" data-act="burger" aria-label="Menu">${IC.menu}</button>` : ''}
    <span class="app-name">${home ? 'ShiftEaze' : isAdmin ? 'Food Utility' : S.role === 'vadmin' ? 'Vendor portal' : S.role === 'employee' ? 'Food Utility' : 'Canteen counter'}</span>
    <nav class="nav-menu">${items}</nav>
    <div class="nav-right">${isAdmin && !home ? siteSwitch() : ''}${clockPill()}<button class="apps systray" data-act="systray" data-name="Discuss" aria-label="Discuss">${IC.chat}</button><button class="apps systray" data-act="systray" data-name="Activities" aria-label="Activities">${IC.activity}</button><span class="company">NEXT EDGE SOLAR</span>
      <div class="dd right"><button class="user-btn" data-act="dd" aria-haspopup="true"><span class="avatar">${esc((u.name || '?').slice(0, 1))}</span><span class="who">${esc(u.name)}<small>${isAdmin ? 'Admin' : S.role === 'employee' ? 'Employee, ' + esc(E.site(u.siteId || '').name || 'Staff') : ROLE[S.role] + ', ' + esc(vend ? vend.name : '')}</small></span></button>
        <div class="dd-menu"><div class="hint">${esc(u.email || u.code || '')}</div><button data-act="resetAsk">Reset demo data</button><div class="sep"></div><button data-act="logout">Log out</button></div></div>
    </div></header>${home ? content : `<main>${content}</main>`}`;
      }
      function render() {
        const app = document.getElementById('app');
        const ae = document.activeElement, fid = ae && ae.id, sel = ae && typeof ae.selectionStart === 'number' ? ae.selectionStart : null;
        const scroll = window.scrollY;
        if (!App.S || !ROUTES[App.S.role] || !E.user(App.S.userId)) { App.S = null; document.body.classList.remove('is-mob'); app.innerHTML = App.pages.login(); return; }
        const r = route();
        let name = r.name;
        if (!ROUTES[App.S.role].includes(name)) name = HOME[App.S.role];
        UI.route = name;
        if (App.S.role === 'employee') {
          document.body.classList.add('is-mob');
          app.innerHTML = A.mshell(App.pages[name](r.arg), name);
        } else {
          document.body.classList.remove('is-mob');
          app.innerHTML = shell(App.pages[name](r.arg), name);
        }
        renderQR(app);
        labelCards(app);
        if (UI.lastRoute === name) window.scrollTo(0, scroll); else window.scrollTo(0, 0);
        UI.lastRoute = name;
        if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { if (sel != null) el.setSelectionRange(sel, sel); } catch (e) { } } }
      }
      App.render = render;
      const ph = (title, crumbs, actions, o) => {
        o = o || {};
        const bc = /#\/vendors"/.test(crumbs || '') ? '<a href="#/vendors">Vendors</a>' : '';
        const sb = searchBar(o);
        return `<div class="o-cp${sb ? '' : ' flat'}"><div class="o-cp-l">${actions ? `<div class="o-cp-btns">${actions}</div>` : ''}<h1 class="bc">${bc ? `<span class="bc-p">${bc}</span><span class="bc-sep">/</span>` : ''}<span class="bc-cur">${title}</span></h1></div>${sb ? `<div class="o-cp-c">${sb}</div>` : ''}<div class="o-cp-r">${o.pager ? `<span class="o-pager">${o.pager}</span>` : ''}${o.right || ''}</div></div>`;
      };
      function siteSwitch() {
        const s = scope(), cur = s.site ? E.site(s.site) : null;
        return `<div class="dd right site-sw"><button class="nav-btn" data-act="dd" aria-haspopup="true" aria-label="Site: ${cur ? esc(cur.name) : 'All sites'}">${IC.pin}<span class="sw-l">${cur ? esc(cur.name) : 'All sites'}</span>${IC.caret}</button><div class="dd-menu"><div class="hint">Show data for</div><button class="${!s.site ? 'on' : ''}" data-act="scopeSet" data-k="site" data-v="" data-force="1">All sites</button>${DB.sites.map(x => `<button class="${s.site === x.id ? 'on' : ''}" data-act="scopeSet" data-k="site" data-v="${x.id}" data-force="1">${esc(x.name)} <span class="faint small">${esc(x.code)}</span></button>`).join('')}</div></div>`;
      }
      function facet(label, val, key) { return `<span class="o-facet"><span class="o-facet-l">${IC.filter}</span><span class="o-facet-v"><small>${label}</small>${esc(val)}</span><button class="o-facet-x" data-act="scopeUnset" data-k="${key}" aria-label="Remove ${label} filter">×</button></span>`; }
      function searchBar(o) {
        const scoped = App.S && App.S.role === 'admin' && SCOPED.includes(UI.route);
        if (!scoped && !o.search) return '';
        const s = scoped ? scope() : {};
        const facets = scoped ? (s.site ? facet('Site', E.site(s.site).name, 'site') : '') + (s.vendor ? facet('Vendor', E.vendor(s.vendor).name, 'vendor') : '') : '';
        const inp = o.search ? `<input type="search" id="${o.search.id}" data-f="${o.search.f}" value="${esc(o.search.value)}" placeholder="${esc(o.search.ph || 'Search...')}" aria-label="Search">` : `<button class="o-search-ph" data-act="openFilter">${facets ? '' : 'Filter by site or vendor'}</button>`;
        const vlist = scoped ? DB.vendors.filter(v => !s.site || v.siteId === s.site) : [];
        const dd = scoped ? `<div class="dd right o-search-dd"><button class="o-search-tg" data-act="dd" aria-label="Filter by site or vendor" aria-haspopup="true">${IC.caret}</button><div class="dd-menu o-filter-menu"><div class="o-fcol"><h4>${IC.filter} Site</h4>${DB.sites.map(x => `<button class="${s.site === x.id ? 'on' : ''}" data-act="scopeSet" data-k="site" data-v="${x.id}">${esc(x.name)}</button>`).join('')}</div><div class="o-fcol"><h4>${IC.filter} Vendor</h4>${vlist.map(x => `<button class="${s.vendor === x.id ? 'on' : ''}" data-act="scopeSet" data-k="vendor" data-v="${x.id}">${esc(x.name)}</button>`).join('')}</div></div></div>` : '';

      }
      const kpi = (l, v, s, tone) => `<div class="kpi ${tone || ''}"><div class="l">${l}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
      Object.assign(App, { ph, kpi });

      const ACT = App.ACT = {}, CH = App.CH = {};
      document.addEventListener('click', e => {
        const a = e.target.closest('[data-act]');
        if (!a || a.dataset.act !== 'dd') document.querySelectorAll('.dd.open').forEach(d => { if (!a || !d.contains(a)) d.classList.remove('open'); });

        if (!a) return;
        const fn = ACT[a.dataset.act];
        if (fn) { e.preventDefault(); fn(a, e); }
      });
      document.addEventListener('change', e => {
        const t = e.target;
        if (t.dataset.f) { setF(t); render(); return; }
        if (t.dataset.ch && CH[t.dataset.ch]) CH[t.dataset.ch](t, e);

        const t = e.target;
        if (t.dataset.f && (t.type === 'search' || t.type === 'text')) { clearTimeout(UI.deb); UI.deb = setTimeout(() => { setF(t); render(); }, 220); }
        if (t.dataset.in && CH[t.dataset.in]) CH[t.dataset.in](t, e);
      });

        if (n) n.classList.remove('menu-open');
        go(a.dataset.to);

      ACT.resetDo = () => { closeModal(); seedFresh(); UI.f = {}; UI.sim = null; UI.vd = null; render(); toast('Demo data reset.', 'good'); };

    <p class="small muted" style="margin-top:10px">Currently ${c.live ? 'following live India time' : 'using a test time'}.</p>`,
          `<button class="btn" data-act="clockLive">Use live IST</button><button class="btn btn-primary" data-act="clockSet">Apply test time</button>`);
      };

        const d = document.getElementById('ck-date').value, t = toMin(document.getElementById('ck-time').value);
        if (!d || isNaN(t)) return toast('Enter a date and a time.', 'bad');
        DB.settings.clock = { live: false, date: d, min: t }; save(); closeModal(); render(); toast('Test time set to ' + fmtDate(d) + ', ' + hhmm(t) + '.');
      };
      ACT.clockLive = () => { DB.settings.clock.live = true; save(); closeModal(); render(); toast('Clock follows live India time.'); };

        if (!App.S || !DB.settings.clock.live) return;
        const busy = document.querySelector('.mask') || (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName));
        if (!busy && ['dashboard', 'vdash', 'vguests', 'vpeople', 'counter', 'cserved', 'm'].includes(UI.route)) render();
        else { const c = document.querySelector('.clock'); if (c) c.outerHTML = clockPill(); }
      }, 30000);

      /* ---------- login ---------- */
      const DEMO_EMP = [['MUN-10231', 'shift A, half-day leave'], ['MUN-10244', 'shift B, OT'], ['MUN-10252', 'night shift C'], ['MUN-10267', 'on leave'], ['MUN-10378', 'not rostered'], ['MUN-10347', 'food off']];
      App.pages.login = () => {

      <!-- DEMO ACCOUNTS - Dedicated Scroll Section Under Login -->
      <div class="demo">
        <div class="demo-head-row">
          <h3>Demo accounts</h3>
          <span class="demo-scroll-hint">Scroll for all accounts &darr;</span>
        </div>
        <p class="demo-sub">Click to fill credentials &middot; <b>admin123</b> Admin &middot; <b>vendor123</b> vendors &middot; <b>emp123</b> employees.</p>
        <div class="demo-scroll-wrap">
          <div class="demo-list">
            <button class="demo-acc" data-act="fill" data-email="${esc(ad.email)}" data-pass="${esc(ad.password)}">
              <span><b>Admin</b><br><small>All sites and vendors, full setup and guest list</small></span>
              <small>${esc(ad.email)}</small>
            </button>
            <div class="demo-acc" style="cursor:default">
              <span><b>Employees (web portal)</b><br><small>Utilities, Food: today's meals, scan QR, my meals, menu</small></span>
              <span class="chips" style="justify-content:flex-end">${DEMO_EMP.map(([code, label]) => { const x = DB.employees.find(y => y.code === code); return x ? `<button class="chip" data-act="fill" data-email="${x.code}" data-pass="${esc(x.password)}" title="${esc(x.code + ' ' + x.name)}">${esc(x.name.split(' ')[0])}, ${label}</button>` : ''; }).join('')}</span>
            </div>
            ${DB.vendors.map(v => `<div class="demo-acc" style="cursor:default"><span><b>${esc(v.name)}</b><br><small>${v.atSite ? 'At-site' : 'Off-site'} canteen, ${esc(E.site(v.siteId).name)}</small></span><span class="chips" style="justify-content:flex-end">${v.users.map(u => `<button class="chip" data-act="fill" data-email="${esc(u.email)}" data-pass="${esc(u.password)}" title="${esc(u.email)}">${v.users.filter(x => x.role === u.role).length > 1 ? esc(u.name) : ROLE[u.role] || 'Login'}</button>`).join('')}</span></div>`).join('')}

      };
      ACT.fill = a => { document.getElementById('lg-email').value = a.dataset.email; document.getElementById('lg-pass').value = a.dataset.pass; document.getElementById('lg-err').textContent = ''; document.querySelector('.login button[type=submit]').focus(); };
      ACT.login = () => {
        const em = document.getElementById('lg-email').value.trim().toLowerCase(), pw = document.getElementById('lg-pass').value;
        const err = document.getElementById('lg-err');
        if (!em || !pw) { err.textContent = 'Enter your email or employee ID and your password.'; return; }
        const emp = DB.employees.find(x => x.code.toLowerCase() === em && x.password === pw);
        if (emp) { window.location.href = 'ShiftEaze Mobile \u2013 Utilities_ Food.html#/home'; return; }
        const ad = DB.admins.find(a => a.email.toLowerCase() === em && a.password === pw);
        if (ad) { App.S = { role: 'admin', userId: ad.id }; store(SKEY, App.S); location.hash = '#/home'; render(); return; }
        for (const v of DB.vendors) {
          const u = v.users.find(x => x.email.toLowerCase() === em && x.password === pw);
          if (u) {
            if (!v.active) { err.textContent = v.name + ' is inactive. Ask the Admin to activate it.'; return; }
            App.S = { role: u.role === 'counter' ? 'counter' : 'vadmin', userId: u.id }; store(SKEY, App.S); location.hash = '#/' + HOME[App.S.role]; render(); return;
          }
        }
        err.textContent = 'Email, employee ID or password is incorrect.';
      };

      /* ---------- home ---------- */
      App.pages.home = () => {
        const apps = [['Dashboards', '#2d3142'], ['Chat', '#2f6fb3'], ['Rostering', '#c7a469'], ['Employees', '#8d5aa8'], ['Rosters Planner', '#6b3b2e'], ['Attendances', '#e08a2e'], ['Calendar', '#2f6fb3'], ['Configurations', '#4b5563'], ['User Tokens', '#8e5a7e'], ['Leave', '#e36b3b'], ['Masters', '#2d3142'], ['Audit Logs', '#3c6e8f'], ['AI Roster Planner', '#1f8a70'], ['Kronos Attendance', '#2f7fb3'], ['Helpdesk', '#222'], ['Approval Management', '#6b8f71'], ['Performance Passbook', '#3a2d8f'], ['AI Calling Config', '#8e5a7e']];
        const tile = (n, c) => `<button class="tile dim" data-act="otherApp" data-name="${esc(n)}"><span class="ic"><span style="background:${c}">${esc(n.split(' ').map(w => w[0]).join('').slice(0, 2))}</span></span>${esc(n)}</button>`;
        return `<div class="home"><div class="home-grid">
    <button class="tile new" data-act="go" data-to="dashboard"><span class="ic"><span style="background:#563c9d">${IC.plate}</span><span class="tag">New</span></span>Food Utility</button>
    ${apps.map(a => tile(a[0], a[1])).join('')}</div></div>`;
      };
      ACT.otherApp = a => toast(a.dataset.name + ' is an existing ShiftEaze app and is not part of this prototype.');

      /* ---------- admin scope: site and vendor ---------- */
      function scope() { const s = DB.settings.scope || (DB.settings.scope = { site: '', vendor: '' }); if (s.vendor && !E.vendor(s.vendor)) s.vendor = ''; return s; }
      function scopeSite() { const s = scope(); return s.vendor ? E.vendor(s.vendor).siteId : s.site; }
      function scopeVendors() { const s = scope(); return DB.vendors.filter(v => (!s.site || v.siteId === s.site) && (!s.vendor || v.id === s.vendor)); }
      function scopeLabel() { const s = scope(); return s.vendor ? E.vendor(s.vendor).name : s.site ? E.site(s.site).name : 'All sites and vendors'; }
      const SCOPED = ['tx', 'log', 'vendors', 'map', 'billing', 'employees', 'roster', 'leaves', 'ext', 'sim'];
      function scopeBar(r) {
        if (!SCOPED.includes(r)) return '';
        const s = scope(), vlist = DB.vendors.filter(v => !s.site || v.siteId === s.site);
        const siteOnly = ['employees', 'roster', 'leaves', 'ext'].includes(r);
        return `<div class="scope" role="region" aria-label="Site and vendor filter"><div class="scope-in">
    <label class="scope-l" for="sc-site">Site</label><select id="sc-site" class="${s.site ? 'set' : ''}" data-ch="scopeSite">${siteOpts(s.site, true)}</select>
    <label class="scope-l" for="sc-vendor">Vendor</label><select id="sc-vendor" class="${s.vendor ? 'set' : ''}" data-ch="scopeVendor">${vendorOpts(s.vendor, true, vlist)}</select>
    ${s.site || s.vendor ? '<button class="btn btn-link" data-act="scopeClear">Clear filter</button>' : ''}
    <span class="scope-note">${siteOnly ? 'Employee pages follow the site' + (s.vendor ? ' of the chosen vendor' : '') : 'Applies across dashboard, transactions, scans, masters and billing'}</span></div></div>`;
      }
      CH.scopeSite = t => { const s = scope(); s.site = t.value; if (s.vendor && s.site && E.vendor(s.vendor).siteId !== s.site) s.vendor = ''; if (!s.site) s.vendor = ''; save(); render(); };
      CH.scopeVendor = t => { const s = scope(); s.vendor = t.value; if (s.vendor) s.site = E.vendor(s.vendor).siteId; save(); render(); };
      ACT.scopeSet = a => { const s = scope(), k = a.dataset.k, v = a.dataset.v; if (k === 'site') { s.site = a.dataset.force ? v : (s.site === v ? '' : v); if (s.vendor && E.vendor(s.vendor).siteId !== s.site) s.vendor = ''; } else { s.vendor = s.vendor === v ? '' : v; if (s.vendor) s.site = E.vendor(s.vendor).siteId; } save(); render(); };
      ACT.scopeUnset = a => { const s = scope(); if (a.dataset.k === 'site') { s.site = ''; s.vendor = ''; } else s.vendor = ''; save(); render(); };
      ACT.openFilter = (a, ev) => { ev.stopPropagation(); const d = a.closest('.o-search').querySelector('.o-search-dd'); if (d) { document.querySelectorAll('.dd.open').forEach(x => x.classList.remove('open')); d.classList.add('open'); } };
      ACT.systray = a => toast(a.dataset.name + ' is part of ShiftEaze and is not in this prototype.');
      ACT.scopeClear = () => { DB.settings.scope = { site: '', vendor: '' }; save(); render(); };
      Object.assign(App, { scope, scopeSite, scopeVendors, scopeLabel });

      /* ---------- admin dashboard ---------- */
      App.pages.dashboard = () => {
        const n = now();
        const f = getF('dash', { site: '', vendor: '', date: n.date, vtype: '' });
        // Site → Vendor cascade (local to dashboard, independent of global scope bar)
        const allSites = DB.sites;

  <script>

      /* ---------- spreadsheet parsing ---------- */
      function isoLocal(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
      function parseDate(v) {
        if (v instanceof Date && !isNaN(v)) return isoLocal(v);
        if (typeof v === 'number' && v > 20000 && v < 80000) return dateOf(Math.round(v) - 25569);
        const s = String(v || '').trim();
        let m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
        if (m) return m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);

        if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return y + '-' + pad(+m[2]) + '-' + pad(+m[1]); }

        if (m) { const i = FU.MONTHS.findIndex(x => x.toLowerCase() === m[2].toLowerCase()); if (i >= 0) return m[3] + '-' + pad(i + 1) + '-' + pad(+m[1]); }
        return null;

        return lines.map(l => { if (sep === '\t') return l.split('\t'); const out = []; let cur = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === ',' && !q) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out; });
      }

        return new Promise((res, rej) => {
          const rd = new FileReader();

          if (!window.XLSX) { rej(new Error('The Excel reader is still loading. Try again in a moment, or paste the rows instead.')); return; }
          rd.onload = () => { try { const wb = XLSX.read(new Uint8Array(rd.result), { type: 'array', cellDates: true }); const ws = wb.Sheets[wb.SheetNames[0]]; res(XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' })); } catch (e) { rej(new Error('This file could not be read as a spreadsheet.')); } };
          rd.onerror = () => rej(new Error('The file could not be read.'));

      }

<div class="panel">
  <div class="panel-h"><h2>Transaction Log</h2><span class="badge">${txRows.length} records</span></div>
  ${txRows.length ? `<div class="tbl-wrap"><table class="list cards"><thead><tr><th>Ref</th><th>Date</th><th>Time</th><th>Person</th><th>Type</th><th>Vendor</th><th>Meal</th><th>Status</th><th class="num">Amount</th></tr></thead><tbody>${txRows.map(t => {
            const emp = t.emp ? e.emp(t.emp) : null;
            const guest = t.guest ? db.guests.find(g => g.id === t.guest) : null;
            const vend = e.vendor(t.vendor) || {};
            const ml = e.meal(t.meal) || {};
            return `<tr><td class="nowrap small">${esc(t.ref)}</td><td class="nowrap">${fmtDay(t.mealDate)}</td><td class="nowrap">${hhmm(t.min)}</td><td>${emp ? esc(emp.name) : guest ? esc(guest.name) + ' <span class="badge">Guest</span>' : '\u2013'}</td><td><span class="badge">${t.emp ? 'Employee' : 'Guest'}</span></td><td class="small">${esc(vend.name || '')}</td><td>${esc(ml.name || '')}</td><td><span class="badge ${t.status === 'chargeable' ? 'b-warn' : 'b-good'}">${t.status === 'chargeable' ? 'Chargeable' : 'Company-paid'}</span></td><td class="num">${t.status === 'chargeable' ? money(t.rate) : '\u2013'}</td></tr>`;
          }).join('')
            }</tbody></table></div>` : '<div class="empty"><h3>No transactions</h3><p>Adjust the filters to see transactions.</p></div>'}
</div>`;
      };
      CH.fadmSite = t => { A.getF('fadm', {}).site = t.value; A.render(); };
      CH.fadmDate = t => { A.getF('fadm', {}).date = t.value; A.render(); };

      /* ---------- roster, leave, OT ---------- */
      P.roster = () => {
        const db = DB(), e = E(), n = A.now();
        const f = A.getF('ros', { week: mondayOf(n.date), q: '' });
        const site = A.scopeSite();
        const days = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(f.week, i));
        const q = f.q.trim().toLowerCase();
        const emps = db.employees.filter(x => (!site || x.siteId === site) && (!q || (x.code + ' ' + x.name).toLowerCase().includes(q)));
        const note = (emp, d) => {
          const out = [];
          db.leaves.filter(l => l.emp === emp && l.date === d && l.state === 'approved').forEach(l => out.push(`<span class="cell-note">${l.kind === 'full' ? 'Leave' : 'Leave ' + hhmm(l.from) + '–' + hhmm(l.to)}</span>`));
          db.extensions.filter(x => x.emp === emp && x.date === d && x.state === 'approved').forEach(x => out.push(`<span class="cell-note ext">${x.kind} ${hhmm(x.from)}–${hhmm(x.to)}</span>`));
          return out.join('');
        };
        return A.ph('Roster', '', '', { search: { id: 'ros-q', f: 'ros.q', value: f.q, ph: 'Search employee code or name...' } }) + `<p class="lead">This stands in for shift.roster.plan.line in ShiftEaze so you can test the engine. A night shift is dated the day it finishes: shift C on ${fmtDay(n.date)} runs from 22:00 the evening before.</p>
  <div class="panel"><div class="filters">
    <div class="week-nav"><button class="btn" data-act="rosWeek" data-d="-7" aria-label="Previous week">‹</button><b style="min-width:150px;text-align:center">${fmtDay(days[0])} to ${fmtDay(days[6])}</b><button class="btn" data-act="rosWeek" data-d="7" aria-label="Next week">›</button><button class="btn" data-act="rosWeek" data-d="0">This week</button></div>
    <span class="small muted">${db.shifts.map(s => esc(s.code) + ' ' + hhmm(s.start) + '–' + hhmm(s.end)).join(', ')}, WO weekly off</span>
  </div><div class="tbl-wrap"><table class="list cards"><thead><tr><th>Employee</th>${days.map(d => `<th class="${d === n.date ? 'today' : ''}">${weekday(d)} ${fmtDay(d)}</th>`).join('')}</tr></thead><tbody>
  ${emps.map(x => `<tr><td class="nowrap"><b style="font-weight:500">${esc(x.name)}</b><div class="small muted">${esc(x.code)}</div></td>${days.map(d => { const l = e.rosterLine(x.id, d), v = l ? l.shift : ''; return `<td class="${d === n.date ? 'today' : ''}"><select data-ch="rosSet" data-emp="${x.id}" data-date="${d}" aria-label="${esc(x.name)} on ${fmtDay(d)}"><option value="">–</option>${db.shifts.map(s => A.opt(s.id, s.code, v)).join('')}${A.opt('WO', 'WO', v)}</select>${note(x.id, d)}</td>`; }).join('')}</tr>`).join('')}
  </tbody></table></div></div>`;
      };
      ACT.rosWeek = a => { const f = A.getF('ros', {}); const d = +a.dataset.d; f.week = d === 0 ? mondayOf(A.now().date) : addDays(f.week, d); A.render(); };
      CH.rosSet = t => {
        const db = DB(), emp = t.dataset.emp, d = t.dataset.date, v = t.value;
        const i = db.roster.findIndex(l => l.emp === emp && l.date === d);
        if (!v) { if (i >= 0) db.roster.splice(i, 1); }
        else if (i >= 0) db.roster[i].shift = v; else db.roster.push({ id: E().nid('rl'), emp, date: d, shift: v });
        A.save(); A.toast('Roster updated for ' + fmtDay(d) + '.');
      };
      function recPage(kind) {
        const db = DB(), e = E(), n = A.now(), isLeave = kind === 'leave';
        const site = A.scopeSite(), emps = db.employees.filter(x => !site || x.siteId === site);
        const list = (isLeave ? db.leaves : db.extensions).filter(r => emps.some(x => x.id === r.emp)).slice().sort((a, b) => a.date < b.date ? 1 : -1);
        const f = A.getF(kind, { date: n.date });
        return A.ph(isLeave ? 'Leave' : 'OT and extensions', '<a href="#/dashboard">Food Utility</a> / Roster data') + `<p class="lead">${isLeave ? 'Approved leave from ShiftEaze. A full-day leave makes the day free. A half-day or hourly leave removes only its hours from duty.' : 'Approved OT and shift extensions from ShiftEaze. They add to duty time, so they block off-site meals and allow at-site meals in those hours.'}</p>
  <div class="panel" style="margin-bottom:16px"><div class="panel-h"><h2>Add ${isLeave ? 'approved leave' : 'OT or extension'}</h2></div><div class="panel-b"><div class="row" style="align-items:flex-end">
    <label class="field"><span>Employee</span><select id="rc-emp">${A.empOpts('', null, emps)}</select></label>
    <label class="field"><span>Date</span><input type="date" id="rc-date" value="${f.date}"></label>
    <label class="field"><span>Type</span><select id="rc-kind">${isLeave ? A.opt('partial', 'Half-day or hourly', '') + A.opt('full', 'Full day', '') : A.opt('Extension', 'Shift extension', '') + A.opt('OT', 'OT', '')}</select></label>
    <label class="field"><span>From</span><input type="time" id="rc-from" value="${isLeave ? '06:00' : '14:00'}"></label>
    <label class="field"><span>To</span><input type="time" id="rc-to" value="${isLeave ? '10:00' : '15:00'}"></label>
    <label class="field" style="flex:1;min-width:160px"><span>Note</span><input type="text" id="rc-note" placeholder="${isLeave ? 'Half-day leave' : 'Vessel delay'}"></label>
    <button class="btn btn-primary" data-act="rcAdd" data-kind="${kind}">Add</button></div><p class="err" id="rc-err"></p></div></div>
  <div class="panel">${list.length ? `<div class="tbl-wrap"><table class="list cards"><thead><tr><th>Employee</th><th>Date</th><th>Type</th><th>Hours</th><th>Note</th><th>Status</th><th></th></tr></thead><tbody>
  ${list.map(r => { const x = e.emp(r.emp); return `<tr><td>${esc(x ? x.code + ' ' + x.name : '')}</td><td class="nowrap">${fmtDate(r.date)}</td><td>${isLeave ? (r.kind === 'full' ? 'Full day' : 'Half-day or hourly') : esc(r.kind)}</td><td class="nowrap">${isLeave && r.kind === 'full' ? 'Whole day' : hhmm(r.from) + '–' + hhmm(r.to)}</td><td class="small">${esc(r.note || '')}</td><td><span class="badge b-good">Approved</span></td><td><button class="icon-btn" data-act="rcDel" data-kind="${kind}" data-id="${r.id}" aria-label="Delete">×</button></td></tr>`; }).join('')}
  </tbody></table></div>` : '<div class="empty"><h3>Nothing recorded</h3><p>Add a record above to test how it changes meal eligibility.</p></div>'}</div>`;
      }
      P.leaves = () => recPage('leave');
      P.ext = () => recPage('ext');
      ACT.rcAdd = a => {
        const kind = a.dataset.kind, db = DB(), isLeave = kind === 'leave';
        const emp = document.getElementById('rc-emp').value, date = document.getElementById('rc-date').value, k = document.getElementById('rc-kind').value;
        const from = toMin(document.getElementById('rc-from').value), to = toMin(document.getElementById('rc-to').value), note = document.getElementById('rc-note').value.trim();
        const err = document.getElementById('rc-err');
        if (!emp || !date) { err.textContent = 'Choose an employee and a date.'; return; }
        if (!(isLeave && k === 'full')) { if (isNaN(from) || isNaN(to)) { err.textContent = 'Enter from and to times.'; return; } if (isLeave && from >= to) { err.textContent = 'Leave from time must be before the to time.'; return; } if (!isLeave && from === to) { err.textContent = 'From and to cannot be the same.'; return; } }
        const rec = { id: E().nid(isLeave ? 'lv' : 'ext'), emp, date, kind: k, from: isNaN(from) ? 0 : from, to: isNaN(to) ? 0 : to, state: 'approved', note };
        (isLeave ? db.leaves : db.extensions).push(rec);
        A.getF(kind, {}).date = date;
        A.save(); A.render(); A.toast('Added. Check the effect in the scan test console.', 'good');
      };
      ACT.rcDel = a => { const db = DB(), k = a.dataset.kind === 'leave' ? 'leaves' : 'extensions'; db[k] = db[k].filter(r => r.id !== a.dataset.id); A.save(); A.render(); A.toast('Deleted.'); };

    })();
  </script>
  <script>
    (function () {
      'use strict';
      const A = window.App, UI = A.UI, ACT = A.ACT, CH = A.CH, P = A.pages;
      const { hhmm, dayNum, addDays, fmtDate, fmtDay, weekday, mondayOf, money } = FU;
      const esc = A.esc;
      const DB = () => A.DB, E = () => A.E;

      /* ---------- billing (shared) ---------- */
      function billingData(v, month) {
        const e = E();
        const all = DB().transactions.filter(t => t.vendor === v.id && t.mealDate.slice(0, 7) === month);
        const txs = all.filter(t => t.state === 'done');
        const groups = {};
        txs.forEach(t => { const k = t.meal + '|' + t.rate; (groups[k] = groups[k] || { meal: t.meal, rate: t.rate, ent: 0, chg: 0 })[t.status === 'entitled' ? 'ent' : 'chg']++; });
        const gs = Object.values(groups).sort((a, b) => (e.meal(a.meal).seq - e.meal(b.meal).seq) || a.rate - b.rate);
        const tot = gs.reduce((s, g) => ({ ent: s.ent + g.ent, chg: s.chg + g.chg, ea: s.ea + g.ent * g.rate, ca: s.ca + g.chg * g.rate }), { ent: 0, chg: 0, ea: 0, ca: 0 });
        return { v, month, gs, tot, cancelled: all.length - txs.length };
      }
      function billingBody(b, vendorView) {
        const e = E(), [y, m] = b.month.split('-'), mon = FU.MONTHS[+m - 1] + ' ' + y, { gs, tot } = b;
        return `<div class="kpis">${A.kpi(vendorView ? 'To invoice the company' : 'Company pays ' + esc(b.v.name), money(tot.ea), tot.ent + ' company-paid meals', 'good')}${A.kpi('Collected at the counter', money(tot.ca), tot.chg + ' chargeable meals', 'warn')}${A.kpi('Total meals', tot.ent + tot.chg, mon)}${A.kpi('Cancelled, excluded', b.cancelled, 'Not billed')}</div>
  <div class="panel">${gs.length ? `<div class="tbl-wrap"><table class="list cards"><thead><tr><th>Meal</th><th class="num">Rate</th><th class="num">Company-paid meals</th><th class="num">Company amount</th><th class="num">Chargeable meals</th><th class="num">Collected by vendor</th><th class="num">Total meals</th></tr></thead><tbody>
  ${gs.map(g => `<tr><td>${esc(e.meal(g.meal).name)}</td><td class="num">${money(g.rate)}</td><td class="num">${g.ent}</td><td class="num">${money(g.ent * g.rate)}</td><td class="num">${g.chg}</td><td class="num">${money(g.chg * g.rate)}</td><td class="num">${g.ent + g.chg}</td></tr>`).join('')}
  <tr class="total"><td colspan="2">Total</td><td class="num">${tot.ent}</td><td class="num">${money(tot.ea)}</td><td class="num">${tot.chg}</td><td class="num">${money(tot.ca)}</td><td class="num">${tot.ent + tot.chg}</td></tr></tbody></table></div><div class="more">Amounts use the rate stored on each transaction, so a mid-month rate change shows both rates as separate rows.</div>` : `<div class="empty"><h3>No meals for ${esc(b.v.name)} in ${mon}</h3><p>Choose another month${vendorView ? '' : ' or vendor'}.</p></div>`}</div>`;
      }
      P.billing = () => {
        const db = DB(), e = E(), n = A.now();
        const list = A.scopeVendors();
        const f = A.getF('bill', { vendor: '', month: n.date.slice(0, 7) });
        const v = e.vendor(A.scope().vendor) || list.find(x => x.id === f.vendor) || list[0];
        if (!v) return A.ph('Monthly billing', '<a href="#/dashboard">Food Utility</a> / Reporting') + '<div class="panel"><div class="empty"><h3>No vendors match the filter</h3><p>Clear the site and vendor filter above.</p></div></div>';
        const b = UI.bill = billingData(v, f.month);
        return A.ph('Monthly billing', '<a href="#/dashboard">Food Utility</a> / Reporting', `<button class="btn" data-act="billCsv" ${b.gs.length ? '' : 'disabled'}>Copy as CSV</button>`) + `
  <div class="panel" style="margin-bottom:16px"><div class="filters" style="border-bottom:0;border-radius:var(--radius)"><label class="field"><span>Vendor</span><select data-f="bill.vendor">${A.vendorOpts(v.id, false, list)}</select></label><label class="field"><span>Month</span><input type="month" data-f="bill.month" value="${f.month}"></label></div></div>
  ${billingBody(b)}`;
      };
      ACT.billCsv = () => { const b = UI.bill; A.copyCSV([['Vendor', 'Month', 'Meal', 'Rate', 'Company-paid meals', 'Company amount', 'Chargeable meals', 'Collected by vendor']].concat(b.gs.map(g => [b.v.name, b.month, E().meal(g.meal).name, g.rate, g.ent, g.ent * g.rate, g.chg, g.chg * g.rate])), 'billing'); };

      /* ---------- vendor helpers ---------- */
      function myVendor() {
        const vs = A.vendorsOf();
        if (!UI.vsel || !vs.some(v => v.id === UI.vsel)) UI.vsel = vs[0] && vs[0].id;
        return E().vendor(UI.vsel);
      }
      const isCounter = () => A.S.role === 'counter';
      const VTITLE = { vdash: 'Dashboard', vpeople: 'People', vguests: 'Guests', vhistory: 'Transactions', vmenu: 'Weekly menu', vbill: 'Billing', counter: 'Guests', cserved: 'Served today' };
      function vendorHead(v) {
        const n = A.now(), e = E(), ml = e.mealLineAt(v, n.min);
        const next = v.meals.filter(m => m.start > n.min).sort((a, b) => a.start - b.start)[0];
        const vs = A.vendorsOf();
        const pick = vs.length > 1 ? `<select data-ch="vPick" aria-label="Vendor">${A.vendorOpts(v.id, false, vs)}</select>` : '';
        const serving = (UI.route === 'vdash' || UI.route === 'dashboard') ? '' : (ml ? `<span class="o-serving on"><span class="dot"></span>Serving ${esc(e.meal(ml.meal).name.toLowerCase())} until ${hhmm(ml.end)}, ${money(ml.rate)}</span>` : `<span class="o-serving"><span class="dot"></span>Not serving at ${hhmm(n.min)}${next ? ', next ' + esc(e.meal(next.meal).name.toLowerCase()) + ' at ' + hhmm(next.start) : ', closed for today'}</span>`);
        return `<div class="o-cp"><div class="o-cp-l"><h1 class="bc"><span class="bc-p">${esc(v.name)}</span><span class="bc-sep">/</span><span class="bc-cur">${VTITLE[UI.route] || ''}</span></h1>${pick}</div><div class="o-cp-c"><span class="small muted">${esc(v.location)}, ${esc(e.site(v.siteId).name)}</span> ${A.typeBadge(v.atSite)}</div><div class="o-cp-r">${serving}</div></div>`;
      }
      CH.vPick = t => { UI.vsel = t.value; A.render(); };
      const nowAbs = () => { const n = A.now(); return dayNum(n.date) * 1440 + n.min; };
      const canUndo = t => {
        if (!isCounter() || t.state !== 'done' || t.source !== 'vendor_mark' || t.consumer !== 'guest' || t.vendor !== UI.vsel) return false;
        const n = A.now(), ml = E().mealLineAt(E().vendor(t.vendor), n.min);
        return t.mealDate === n.date && !!ml && ml.meal === t.meal;
      };
      const undoBtn = t => canUndo(t) ? `<button class="btn" data-act="undoAsk" data-id="${t.id}">Mark not taken</button>` : '';
      const takenText = (t, v) => `${hhmm(t.min)}${t.vendor !== v.id ? ' at ' + esc(E().vendor(t.vendor).name) : t.source === 'qr_scan' ? ', QR scan' : ', counter mark'}`;

      /* ---------- people (employees) ---------- */
      function peopleRows(v) {
        const e = E(), db = DB(), n = A.now(), ml = e.mealLineAt(v, n.min);
        return db.employees.filter(x => x.siteId === v.siteId && x.food).map(x => {
          if (!ml) return { x, st: 'closed' };
          const tx = e.takenBy('emp', x.id, ml.meal, n.date);
          if (tx) return { x, st: 'taken', tx };
          const res = e.evaluateScan({ empId: x.id, token: v.qrToken, date: n.date, min: n.min, manual: true });
          return { x, st: res.result, res };
        });
      }
      function peopleSection(v, canMark) {
        const e = E(), n = A.now(), ml = e.mealLineAt(v, n.min);
        const f = A.getF('pp', { tab: 'eligible', q: '' });
        const q = f.q.trim().toLowerCase();
        const all = peopleRows(v);
        const groups = { eligible: all.filter(r => r.st === 'entitled' || r.st === 'chargeable'), taken: all.filter(r => r.st === 'taken'), blocked: all.filter(r => r.st === 'blocked' || r.st === 'rejected'), all };
        const rows = (groups[f.tab] || all).filter(r => !q || (r.x.code + ' ' + r.x.name).toLowerCase().includes(q)).sort((a, b) => a.x.name.localeCompare(b.x.name));
        const tabs = [['eligible', 'Eligible now'], ['taken', 'Taken'], ['blocked', 'Not eligible'], ['all', 'All']];
        const status = r => {
          if (r.st === 'taken') return `<span class="badge b-good">Taken</span> <span class="small muted">${takenText(r.tx, v)}</span>`;
          if (r.st === 'entitled') return '<span class="badge b-brand">Eligible, company-paid</span>';
          if (r.st === 'chargeable') return `<span class="badge b-warn">Not opted, ${money(r.res.mealLine.rate)}</span>`;
          return `<span class="badge">Not eligible</span> <span class="small muted">${esc(e.shortReason(r.res))}</span>`;
        };
        const action = r => {
          if (!canMark) return '';
          if (r.st === 'taken') return undoBtn(r.tx);
          if (r.st === 'entitled') return `<button class="btn btn-primary" data-act="pMark" data-id="${r.x.id}">Mark taken</button>`;
          if (r.st === 'chargeable') return `<button class="btn" data-act="pMark" data-id="${r.x.id}">Mark chargeable</button>`;
          return '';
        };
        const today = n.date;
        return `<div class="panel"><div class="filters"><div class="seg" role="tablist" aria-label="People filter">${tabs.map(t => `<button role="tab" aria-selected="${f.tab === t[0]}" class="${f.tab === t[0] ? 'on' : ''}" data-act="ppTab" data-tab="${t[0]}">${t[1]}<span class="n">${ml ? groups[t[0]].length : 0}</span></button>`).join('')}</div><span class="spacer"></span><input type="search" id="pp-q" data-f="pp.q" value="${esc(f.q)}" placeholder="Search employee name or ID" aria-label="Search employees"></div>
  ${!ml ? `<div class="empty"><h3>No meal is being served at ${hhmm(n.min)}</h3><p>The list opens with the next meal window.</p></div>` : rows.length ? `<div class="tbl-wrap"><table class="list cards"><thead><tr><th>ID</th><th>Name</th><th>Designation</th><th>Duty today</th><th>${esc(e.meal(ml.meal).name)}</th>${canMark ? '<th></th>' : ''}</tr></thead><tbody>
  ${rows.map(r => `<tr><td class="nowrap">${esc(r.x.code)}</td><td><b style="font-weight:500">${esc(r.x.name)}</b></td><td class="small">${esc(r.x.designation)}</td><td class="small nowrap">${esc(A.shiftToday(r.x.id, today))}</td><td>${status(r)}</td>${canMark ? `<td class="nowrap">${action(r)}</td>` : ''}</tr>`).join('')}
  </tbody></table></div>` : `<div class="empty"><h3>Nobody in this list</h3><p>${q ? 'Clear the search or ' : ''}try another tab.</p></div>`}
  ${ml ? `<div class="more">Eligibility uses the same rules as a QR scan: roster, OT, extensions and leave, with ${v.atSite ? 'at-site rules (on duty only)' : 'off-site rules (off duty only)'}. Employees usually scan the QR themselves; mark here when a phone is not available.</div>` : ''}</div>`;
      }
      ACT.ppTab = a => { A.getF('pp', {}).tab = a.dataset.tab; A.render(); };
      ACT.pMark = a => {
        const v = myVendor(), n = A.now(), e = E();
        const res = e.evaluateScan({ empId: a.dataset.id, token: v.qrToken, date: n.date, min: n.min, manual: true });
        const emp = e.emp(a.dataset.id);
        if (res.result === 'entitled') { const c = e.commit(res, A.S.userId); A.save(); A.render(); A.toast(emp.name + ': ' + e.meal(res.meal).name + ' marked taken. ' + c.tx.ref, 'good'); return; }
        if (res.result === 'chargeable') {
          UI.pending = res;
          A.modal('Chargeable meal', `<div class="banner warn" style="margin:0 0 12px">${esc(emp.name)} has not opted for ${esc(e.meal(res.meal).name.toLowerCase())}.</div><p>Collect ${money(res.mealLine.rate)} from ${esc(emp.name)} (${esc(emp.code)}) before recording the meal.</p>`, `<button class="btn" data-act="closeModal">Do not serve</button><button class="btn btn-primary" data-act="pendConfirm">Record chargeable meal</button>`);
          return;
        }
        e.commit(res, A.S.userId); A.save(); A.render();
        A.modal('Not allowed', `<div class="banner bad" style="margin:0">${esc(res.message)}</div>`, `<button class="btn btn-primary" data-act="closeModal">OK</button>`);
      };
      ACT.pendConfirm = () => { const res = UI.pending; if (!res) return; const c = E().commit(res, A.S.userId); UI.pending = null; A.save(); A.closeModal(); A.render(); A.toast('Chargeable meal recorded: ' + c.tx.ref, 'warn'); };
      ACT.undoAsk = a => {
        const t = DB().transactions.find(x => x.id === a.dataset.id);
        A.confirmBox('Mark as not taken', `Mark ${esc(E().meal(t.meal).name.toLowerCase())} for ${A.whoName(t)} (${t.ref}) as not taken? You can change this while ${esc(E().meal(t.meal).name.toLowerCase())} is still being served. After that, ask the Admin.`, 'Mark not taken', 'undoDo', { id: t.id }, true);
      };
      ACT.undoDo = a => {
        const t = DB().transactions.find(x => x.id === a.dataset.id), u = E().user(A.S.userId);
