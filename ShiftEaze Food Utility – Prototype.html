        box.innerHTML = `<div class="banner ${ok === out.length ? 'good' : 'warn'}">${ok} of ${out.length} rows are ready.${ok < out.length ? ' Rows with problems will be skipped.' : ''}</div><div class="tbl-wrap"><table class="list cards"><thead><tr><th>Row</th><th>Date</th><th>Meal</th><th>Items</th><th>Check</th></tr></thead><tbody>${out.map(x => `<tr><td>${x.line}</td><td class="nowrap">${x.date ? fmtDay(x.date) : '?'}</td><td>${x.meal ? esc(e.meal(x.meal).name) : '?'}</td><td>${esc(x.items)}</td><td>${x.err.length ? `<span class="small" style="color:var(--bad)">${esc(x.err.join(' '))}</span>` : '<span class="badge b-good">Ready</span>'}</td></tr>`).join('')}</tbody></table></div>`;
        A.labelCards(box); document.getElementById('vm-pub').disabled = !ok;
      };
      ACT.vmPublish = () => {
        const imp = UI.vmimp, v = myVendor(), db = DB(), n = A.now(); if (!imp) return;
        db.menus = db.menus.filter(m => !(m.vendor === v.id && m.weekStart === imp.week));
        db.menus.push({ id: E().nid('menu'), vendor: v.id, weekStart: imp.week, lines: imp.rows.filter(x => !x.err.length).map(x => ({ date: x.date, meal: x.meal, items: x.items })), file: imp.file, by: A.S.userId, at: n.date });
        UI.vmimp = null; A.save(); A.render(); A.toast('Menu published for the week of ' + fmtDay(imp.week) + '.', 'good');
      };
      P.vhistory = () => {
        const v = myVendor(), db = DB(), n = A.now();
        const f = A.getF('vh', { from: addDays(n.date, -6), to: n.date, meal: '', status: '', src: '' });
        const rows = db.transactions.filter(t => t.vendor === v.id && t.mealDate >= f.from && t.mealDate <= f.to && (!f.meal || t.meal === f.meal) && (!f.status || t.status === f.status) && (!f.src || t.source === f.src)).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.min - a.min));
        const done = rows.filter(t => t.state === 'done'), ent = done.filter(t => t.status === 'entitled'), chg = done.filter(t => t.status === 'chargeable');
        return vendorHead(v) + `<div class="kpis">${A.kpi('Meals in period', done.length, fmtDay(f.from) + ' to ' + fmtDay(f.to))}${A.kpi('Company-paid', ent.length, money(ent.reduce((s, t) => s + t.rate, 0)) + ' to invoice', 'good')}${A.kpi('Chargeable', chg.length, money(chg.reduce((s, t) => s + t.rate, 0)) + ' collected', 'warn')}${A.kpi('Cancelled', rows.length - done.length, 'Excluded from billing')}</div>
  <div class="panel"><div class="filters"><label class="field"><span>From</span><input type="date" data-f="vh.from" value="${f.from}"></label><label class="field"><span>To</span><input type="date" data-f="vh.to" value="${f.to}"></label><label class="field"><span>Meal</span><select data-f="vh.meal">${A.mealOpts(f.meal, true)}</select></label><label class="field"><span>Status</span><select data-f="vh.status">${A.opt('', 'Any status', f.status)}${A.opt('entitled', 'Company-paid', f.status)}${A.opt('chargeable', 'Chargeable', f.status)}</select></label><label class="field"><span>How</span><select data-f="vh.src">${A.opt('', 'QR scans and counter marks', f.src)}${A.opt('qr_scan', 'QR scans', f.src)}${A.opt('vendor_mark', 'Counter marks', f.src)}</select></label></div>
  ${A.txTable(rows.slice(0, 300), false, true)}${rows.length > 300 ? `<div class="more">Showing 300 of ${rows.length}.</div>` : ''}</div>`;
      };

    })();
  </script>
  <script>
    (function () {
      'use strict';
      const A = window.App, UI = A.UI, ACT = A.ACT, P = A.pages;
      const { hhmm, dayNum, addDays, fmtDate, fmtDay, weekday, mondayOf, money, rangeLabel } = FU;
      const esc = A.esc;
      const DB = () => A.DB, E = () => A.E;
      const me = () => E().emp(A.S.userId);
      const sv = (d, w) => `<svg width="${w || 22}" height="${w || 22}" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
      const IC = {
        home: sv('<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>'),
        list: sv('<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>'),
        scan: sv('<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M7 12h10"/>', 26),
        menu: sv('<path d="M5 3v8a2 2 0 0 0 2 2v8M9 3v6a2 2 0 0 1-2 2M17 3c-2 1-3 4-3 8h3v10"/>'),
        user: sv('<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>'),
        back: sv('<path d="M15 5l-7 7 7 7"/>', 24),
        qr: sv('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/>', 20)
      };
      const TITLES = { m: 'Food', mscan: 'Scan canteen QR', mresult: 'Scan result', mmeals: 'My meals', mmenu: 'Menu', mprofile: 'Profile' };

      A.mshell = (content, r) => {
        const n = A.now(), c = DB().settings.clock;
        const tabs = [['m', 'Home', IC.home], ['mmeals', 'My meals', IC.list], ['mscan', 'Scan', IC.scan], ['mmenu', 'Menu', IC.menu], ['mprofile', 'Profile', IC.user]];
        const on = t => r === t || (r === 'mresult' && t === 'mscan');
        return `<div class="mob">
    <header class="mob-bar">${r !== 'm' ? `<a class="mob-back" href="#/m" aria-label="Back to Food home">${IC.back}</a>` : ''}<div class="mob-t"><small>Utilities</small><h1>${TITLES[r]}</h1></div><button class="mob-clock ${c.live ? '' : 'test'}" data-act="clock" aria-label="Scan clock">${c.live ? '' : 'Test '}${hhmm(n.min)}</button></header>
    <div class="mob-body">${content}</div>
    <nav class="mob-tabs" aria-label="Food">${tabs.map(t => `<a href="#/${t[0]}" class="${t[0] === 'mscan' ? 'scan ' : ''}${on(t[0]) ? 'on' : ''}" ${on(t[0]) ? 'aria-current="page"' : ''}><span class="ti">${t[2]}</span><span>${t[1]}</span></a>`).join('')}</nav>
  </div>`;
      };

      function dutyLine(emp, D) {
        const e = E(), fd = e.freeDay(emp.id, D);
        if (fd.free) return { text: fd.why, free: true };
        const rs = e.dayRanges(e.duty(emp.id, D).ranges, D);
        return { text: rs.length ? 'On duty ' + rs.map(x => rangeLabel(x, D)).join(', ') : 'No duty hours today', shift: e.shift(fd.line.shift) };
      }
      const greet = m => m < 720 ? 'Good morning' : m < 1020 ? 'Good afternoon' : 'Good evening';
      function statusPill(x) {
        if (x.tx) return `<span class="badge b-good">Taken ${hhmm(x.tx.min)}</span>`;
        const r = x.res;
        if (r.result === 'entitled') return '<span class="badge b-good">Company-paid</span>';
        if (r.result === 'chargeable') return `<span class="badge b-warn">Pay ${money(r.mealLine.rate)}</span>`;
        return `<span class="badge b-bad">${esc(E().shortReason(r))}</span>`;
      }
      function hello(emp, n) {
        const du = dutyLine(emp, n.date);
        return `<div class="m-hello"><div><p class="muted small">${greet(n.min)},</p><h2>${esc(emp.name)}</h2><p class="small muted">${esc(emp.code)}, ${esc(E().site(emp.siteId).name)}</p></div><div class="m-duty ${du.free ? 'free' : ''}"><small>Today, ${weekday(n.date)} ${fmtDay(n.date)}</small><b>${du.shift ? 'Shift ' + esc(du.shift.code) : esc(du.text)}</b>${du.shift ? `<small>${esc(du.text)}</small>` : ''}</div></div>`;
      }

      /* ---------- home ---------- */
      P.m = () => {
        const emp = me(), e = E(), db = DB(), n = A.now();
        if (!emp.food) return hello(emp, n) + `<div class="m-card m-empty"><h3>Food facility is not enabled for you</h3><p class="muted">Ask your admin to turn on the food facility. Once it is on, you can scan canteen QR codes here.</p></div>`;
        const vs = db.vendors.filter(v => v.active && v.siteId === emp.siteId);
        const nowList = vs.map(v => { const ml = e.mealLineAt(v, n.min); if (!ml) return null; const tx = e.takenBy('emp', emp.id, ml.meal, n.date); return { v, ml, tx, res: tx ? null : e.evaluateScan({ empId: emp.id, token: v.qrToken, date: n.date, min: n.min }) }; }).filter(Boolean);
        const ok = nowList.filter(x => !x.tx && x.res.result !== 'blocked' && x.res.result !== 'rejected');
        const next = vs.flatMap(v => v.meals.filter(m => m.start > n.min).map(m => ({ v, m }))).sort((a, b) => a.m.start - b.m.start)[0];
        const offered = A.meals().filter(m => vs.some(v => v.meals.some(x => x.meal === m.id)));
        const mealRow = m => {
          const tx = e.takenBy('emp', emp.id, m.id, n.date);
          const lines = vs.map(v => ({ v, ml: v.meals.find(x => x.meal === m.id) })).filter(x => x.ml);
          const lastEnd = Math.max(...lines.map(x => x.ml.end)), firstStart = Math.min(...lines.map(x => x.ml.start));
          const opted = emp.optins.includes(m.id);
          let cls = '', body;
          if (tx) { cls = 'done'; body = `<b>Taken at ${esc(e.vendor(tx.vendor).name)}, ${hhmm(tx.min)}</b><small>${tx.status === 'chargeable' ? 'Chargeable, ' + money(tx.rate) + ' paid at the counter' : 'Company-paid'}, ${tx.ref}</small>`; }
          else if (n.min >= lastEnd) { cls = 'miss'; body = `<b>Not taken</b><small>Windows closed at ${hhmm(lastEnd)}</small>`; }
          else if (!opted) { cls = 'warn'; body = `<b>Not in your meal plan</b><small>You can still eat; you pay the canteen rate</small>`; }
          else {
            const el = lines.map(x => ({ v: x.v, segs: e.eligibleSegs(emp.id, x.v, x.ml, n.date).filter(s => s[1] > dayNum(n.date) * 1440 + n.min) })).filter(x => x.segs.length);
            if (!el.length) { cls = 'miss'; body = `<b>No canteen available for your duty</b><small>${vs.some(v => v.atSite) ? 'At-site canteens serve staff on shift; off-site canteens serve staff off duty' : 'Off-site canteens serve staff off duty'}</small>`; }
            else body = `<b>${n.min >= firstStart ? 'Open now' : 'From ' + hhmm(firstStart)}</b>${el.map(x => `<small>${esc(x.v.name)}, ${x.segs.map(s => rangeLabel(s, n.date)).join(', ')}${x.v.atSite ? ', at site' : ''}</small>`).join('')}`;
          }
          return `<div class="m-meal ${cls}"><span class="ic" aria-hidden="true">${tx ? '✓' : esc(m.code)}</span><div><div class="m-meal-h">${esc(m.name)}${opted ? '' : ' <span class="badge">Not opted</span>'}</div>${body}</div></div>`;
        };
        return hello(emp, n) + `
  <div class="m-card"><div class="m-card-h"><h3>Serving now</h3><span class="small muted">${hhmm(n.min)}</span></div>
    ${nowList.length ? nowList.map(x => `<div class="m-row"><div class="grow"><b>${esc(x.v.name)}</b><small>${esc(e.meal(x.ml.meal).name)} until ${hhmm(x.ml.end)}, ${x.v.atSite ? 'at site' : 'off site'}</small></div>${statusPill(x)}</div>`).join('') : `<p class="muted small">No canteen is serving right now.${next ? ' Next: ' + esc(e.meal(next.m.meal).name) + ' at ' + hhmm(next.m.start) + ', ' + esc(next.v.name) + '.' : ''}</p>`}
    <a class="btn btn-primary btn-lg btn-block m-scan-btn" href="#/mscan">${IC.qr} Scan canteen QR</a>
    ${nowList.length && !ok.length ? '<p class="small muted" style="margin-top:8px;text-align:center">No canteen can serve you right now. See the reasons above.</p>' : ''}
  </div>
  <div class="m-card"><div class="m-card-h"><h3>Today's meals</h3><a class="small" href="#/mmenu">See menu</a></div>${offered.map(mealRow).join('')}</div>`;
      };

      /* ---------- scan ---------- */
      P.mscan = () => {
        const emp = me(), e = E(), n = A.now();
        if (!emp.food) return `<div class="m-card m-empty"><h3>Food facility is not enabled for you</h3><p class="muted">Ask your admin to turn it on.</p></div>`;
        const vs = DB().vendors.filter(v => v.siteId === emp.siteId);
        return `<div class="viewfinder" aria-hidden="true"><span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span><span class="line"></span></div>
  <p class="m-center"><b>Point your camera at the QR code on the counter</b><br><span class="small muted">The canteen, meal and your eligibility are checked on the server at ${hhmm(n.min)}.</span></p>
  <div class="m-card"><div class="m-card-h"><h3>Prototype: tap the counter you are at</h3></div><p class="small muted" style="margin-bottom:10px">The camera is not used in this prototype. Each button sends that counter's QR code.</p>
    ${vs.map(v => { const ml = e.mealLineAt(v, n.min); return `<button class="m-canteen" data-act="mScan" data-token="${esc(v.qrToken)}"><span class="grow"><b>${esc(v.name)}</b><small>${esc(v.location)}</small><small>${ml ? 'Serving ' + esc(e.meal(ml.meal).name.toLowerCase()) + ' until ' + hhmm(ml.end) : 'Not serving now'}</small></span>${A.typeBadge(v.atSite)}</button>`; }).join('')}
    <label class="field" style="margin-top:10px"><span>Or enter the code printed under the QR</span><div class="row" style="flex-wrap:nowrap"><input type="text" id="m-code" placeholder="FUQR-..." autocapitalize="characters" style="flex:1;height:40px"><button class="btn btn-primary" data-act="mScan" style="height:40px">Check</button></div></label>
  </div>`;
      };
      ACT.mScan = a => {
        const n = A.now(), e = E();
        const tok = a.dataset.token || (document.getElementById('m-code') || {}).value || '';
        const res = e.evaluateScan({ empId: A.S.userId, token: tok.trim().toUpperCase(), date: n.date, min: n.min });
        const c = e.commit(res);
        A.save();
        UI.mres = { res, tx: c.tx, log: c.log };
        A.go('mresult');
      };

      /* ---------- result ---------- */
      P.mresult = () => {
        const L = UI.mres, e = E();
        if (!L) return `<div class="m-card m-empty"><h3>No recent scan</h3><p class="muted">Scan a canteen QR to see the result here.</p><a class="btn btn-primary btn-lg btn-block" href="#/mscan">Scan canteen QR</a></div>`;
        const r = L.res;
        const word = { entitled: 'Approved', chargeable: 'Pay at counter', blocked: 'Not allowed', rejected: 'Not accepted' }[r.result];
        const icon = { entitled: '✓', chargeable: '₹', blocked: '✕', rejected: '!' }[r.result];
        return `<div class="m-verdict ${r.result}" role="status"><div class="m-vicon" aria-hidden="true">${icon}</div><div class="m-vword">${word}</div><div class="m-vmeal">${r.meal ? esc(e.meal(r.meal).name) : 'No meal'}${r.vendorId ? ' at ' + esc(e.vendor(r.vendorId).name) : ''}</div><p class="m-vmsg">${esc(r.message)}</p>
    ${L.tx ? `<div class="m-live"><span class="pulse" aria-hidden="true"></span><b id="m-live">${hhmm(r.min)}:00</b><small>Live screen. Show it at the counter.</small></div>` : ''}</div>
  ${L.tx ? `<div class="m-card"><div class="m-kv"><span class="muted">Reference</span><b class="ref">${L.tx.ref}</b></div><div class="m-kv"><span class="muted">Amount</span><b>${L.tx.status === 'chargeable' ? money(L.tx.rate) + ', pay at the counter' : 'Company-paid'}</b></div><div class="m-kv"><span class="muted">Scanned</span><span>${fmtDay(r.date)}, ${hhmm(r.min)}</span></div></div>` : `<div class="m-card"><div class="m-kv"><span class="muted">Reason code</span><b>${r.code}</b></div><p class="small muted" style="margin-top:6px">Nothing was charged. If you think this is wrong, contact your admin with the time of the scan.</p></div>`}
  <div class="row" style="flex-wrap:nowrap"><a class="btn btn-lg" style="flex:1" href="#/mscan">Scan again</a><a class="btn btn-primary btn-lg" style="flex:1" href="#/m">Done</a></div>`;
      };
      setInterval(() => {
        const el = document.getElementById('m-live'); if (!el) return;
        const n = A.now(), s = new Date().getSeconds();
        el.textContent = hhmm(n.min) + ':' + String(s).padStart(2, '0');
      }, 1000);

      /* ---------- my meals ---------- */
      P.mmeals = () => {
        const emp = me(), db = DB(), e = E(), n = A.now();
        const month = n.date.slice(0, 7);
        const mine = db.transactions.filter(t => t.emp === emp.id).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.min - a.min));
        const mon = mine.filter(t => t.mealDate.slice(0, 7) === month && t.state === 'done');
        const chg = mon.filter(t => t.status === 'chargeable');
        const days = [...new Set(mine.map(t => t.mealDate))].slice(0, 14);
        const blocked = db.scanLog.filter(l => l.emp === emp.id && l.date === n.date);
        return `<div class="m-stats"><div><b>${mon.length}</b><small>Meals this month</small></div><div><b>${mon.length - chg.length}</b><small>Company-paid</small></div><div><b>${money(chg.reduce((s, t) => s + t.rate, 0))}</b><small>Paid by you</small></div></div>
  ${blocked.length ? `<div class="m-card"><div class="m-card-h"><h3>Not served today</h3></div>${blocked.map(l => `<div class="m-row"><div class="grow"><b>${hhmm(l.min)}, ${esc(l.vendor ? e.vendor(l.vendor).name : 'Unknown QR')}</b><small>${esc(l.message)}</small></div><span class="badge b-bad">${l.result === 'blocked' ? 'Blocked' : 'Rejected'}</span></div>`).join('')}</div>` : ''}
  ${days.length ? days.map(d => `<p class="m-date">${d === n.date ? 'Today' : d === addDays(n.date, -1) ? 'Yesterday' : weekday(d) + ' ' + fmtDay(d)}</p><div class="m-card tight">${mine.filter(t => t.mealDate === d).map(t => `<div class="m-row ${t.state === 'cancelled' ? 'struck' : ''}"><span class="m-mi" aria-hidden="true">${esc(e.meal(t.meal).code)}</span><div class="grow"><b>${esc(e.meal(t.meal).name)}, ${hhmm(t.min)}</b><small>${esc(e.vendor(t.vendor).name)}, ${t.ref}${t.source === 'vendor_mark' ? ', marked at counter' : ''}</small></div>${t.state === 'cancelled' ? '<span class="badge">Cancelled</span>' : t.status === 'chargeable' ? `<span class="badge b-warn">${money(t.rate)}</span>` : '<span class="badge b-good">Paid by company</span>'}</div>`).join('')}</div>`).join('') : '<div class="m-card m-empty"><h3>No meals yet</h3><p class="muted">Meals you scan appear here.</p></div>'}`;
      };

      /* ---------- menu ---------- */
      P.mmenu = () => {
        const emp = me(), db = DB(), e = E(), n = A.now();
        const vs = db.vendors.filter(v => v.active && v.siteId === emp.siteId);
        if (!UI.mmv || !vs.some(v => v.id === UI.mmv)) UI.mmv = (vs.find(v => db.menus.some(m => m.vendor === v.id && m.weekStart === mondayOf(n.date))) || vs[0] || {}).id;
        const v = e.vendor(UI.mmv);
        if (!v) return '<div class="m-card m-empty"><h3>No canteens at your site</h3></div>';
        const wk = mondayOf(n.date), menu = db.menus.find(m => m.vendor === v.id && m.weekStart === wk);
        const ms = v.meals.slice().sort((a, b) => a.start - b.start);
        const days = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(wk, i)).filter(d => d >= n.date);
        return `<div class="m-chips" role="tablist" aria-label="Canteen">${vs.map(x => `<button role="tab" aria-selected="${x.id === v.id}" class="chip ${x.id === v.id ? 'on' : ''}" data-act="mMenuV" data-id="${x.id}">${esc(x.name)}</button>`).join('')}</div>
  <p class="small muted" style="margin:8px 2px 12px">${esc(v.location)}, ${v.atSite ? 'at site: eat during your shift' : 'off site: eat when off duty'}</p>
  ${menu ? days.map(d => `<p class="m-date">${d === n.date ? 'Today' : weekday(d) + ' ' + fmtDay(d)}</p><div class="m-card tight">${ms.map(m => { const l = menu.lines.find(x => x.date === d && x.meal === m.meal); const live = d === n.date && m.start <= n.min && n.min < m.end; return `<div class="m-row ${live ? 'live' : ''}"><span class="m-mi" aria-hidden="true">${esc(e.meal(m.meal).code)}</span><div class="grow"><b>${esc(e.meal(m.meal).name)} <span class="small muted" style="font-weight:400">${hhmm(m.start)}–${hhmm(m.end)}</span></b><small>${l ? esc(l.items) : 'Not uploaded'}</small></div>${live ? '<span class="badge b-good">Now</span>' : ''}</div>`; }).join('')}</div>`).join('') : `<div class="m-card m-empty"><h3>No menu this week</h3><p class="muted">${esc(v.name)} has not uploaded this week's menu yet.</p></div>`}`;
      };
      ACT.mMenuV = a => { UI.mmv = a.dataset.id; A.render(); };

      /* ---------- profile ---------- */
      P.mprofile = () => {
        const emp = me(), e = E(), n = A.now(), c = DB().settings.clock;
        return `<div class="m-card"><div class="m-prof"><span class="avatar big">${esc(emp.name.slice(0, 1))}</span><div><h2>${esc(emp.name)}</h2><p class="small muted">${esc(emp.code)}, ${esc(emp.designation)}</p><p class="small muted">${esc(emp.terminal)}, ${esc(e.site(emp.siteId).name)}</p></div></div></div>
  <div class="m-card"><div class="m-card-h"><h3>Food facility</h3>${emp.food ? '<span class="badge b-good">On</span>' : '<span class="badge">Off</span>'}</div>
    <p class="small muted" style="margin-bottom:8px">Your meal plan. Set by your admin.</p><div class="chips">${A.meals().map(m => `<span class="chip static ${emp.optins.includes(m.id) ? 'on' : ''}">${emp.optins.includes(m.id) ? '✓ ' : ''}${esc(m.name)}</span>`).join('')}</div>
    <p class="small muted" style="margin-top:10px">Meals in your plan are company-paid when the rules allow. Other meals are charged at the canteen rate.</p></div>
  <div class="m-card"><div class="m-kv"><span>Accommodation</span><b>${emp.accom ? 'Yes' : 'No'}</b></div></div>
  <div class="m-card"><div class="m-card-h"><h3>Prototype test clock</h3></div><p class="small muted" style="margin-bottom:10px">${c.live ? 'Following live India time.' : 'Using test time ' + fmtDate(n.date) + ', ' + hhmm(n.min) + '.'}</p><button class="btn btn-block" data-act="clock">Change the clock</button></div>
  <button class="btn btn-danger btn-lg btn-block" data-act="logout">Log out</button>`;
      };
      A.boot();
    })();
